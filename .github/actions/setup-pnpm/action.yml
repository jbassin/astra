name: setup-pnpm
description: Install a pinned Node + pnpm and install dependencies from the frozen lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.34.4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
