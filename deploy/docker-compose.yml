# Astra deploy substrate (roadmap Decision H):
#   - SigNoz (ClickHouse + zookeeper + UI + otel-collector + schema migrator),
#     vendored under deploy/signoz/ and `include`d so its own relative mounts
#     (../common/...) resolve correctly. Published ports remapped into 10350-10399.
#   - Dagster control plane (Postgres + code location + webserver + daemon).
#   - Caddy edge.
# SigNoz/OTel is the single pane across all three. Run from deploy/:
#   docker compose up -d
name: astra

include:
  - path: signoz/docker/docker-compose.yaml

x-dagster-env: &dagster-env
  DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME:-dagster}
  DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
  DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
  # Pipeline secrets injected as env by `just up` (Decision E) so the assets'
  # LLM/transcription calls resolve their `ref="sops:KEY"`s in-container (the code
  # server, daemon, and run workers all inherit this anchor).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

# Pipeline data dirs bind-mounted into every Dagster service (code/webserver/daemon)
# so the assets' disk-cache seams persist + are shared across the control plane (and
# with host-dev `uv run dagster dev`, which uses the same host dirs). Host-absolute
# paths kept (config-single-source: scribe/mouthpiece read them from config.kdl;
# linguist resolves them package-relative → `/repo/apps/linguist/...` in-container, so
# its mounts target /repo while scribe/mouthpiece bind same-path under /ruby).
x-dagster-volumes: &dagster-pipeline-volumes
  - /ruby/data/experiments/astra/apps/scribe/incoming:/ruby/data/experiments/astra/apps/scribe/incoming
  - /ruby/data/experiments/astra/apps/scribe/data:/ruby/data/experiments/astra/apps/scribe/data
  - /ruby/data/experiments/astra/apps/scribe/tmp:/ruby/data/experiments/astra/apps/scribe/tmp
  - /ruby/data/experiments/astra/apps/linguist/transcripts:/repo/apps/linguist/transcripts
  - /ruby/data/experiments/astra/apps/linguist/script:/repo/apps/linguist/script
  - /ruby/data/experiments/astra/apps/linguist/data:/repo/apps/linguist/data
  - /ruby/data/experiments/astra/apps/mouthpiece-backend/episodes:/ruby/data/experiments/astra/apps/mouthpiece-backend/episodes

services:
  # --- Dagster: the batch-pipeline control plane ---
  dagster-postgres:
    image: postgres:16-alpine
    container_name: astra-dagster-postgres
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    volumes:
      - dagster-pg:/var/lib/postgresql/data
    networks: [signoz-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USERNAME:-dagster} -d ${DAGSTER_PG_DB:-dagster}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dagster-code:
    build:
      # Repo root (like the frontend services) — the image `uv sync`s the Python
      # workspace so definitions.py can import the real pipeline packages.
      context: ..
      dockerfile: dagster/Dockerfile
    image: astra-dagster:local
    container_name: astra-dagster-code
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-f", "definitions.py"]
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    networks: [signoz-net]
    restart: unless-stopped

  dagster-webserver:
    image: astra-dagster:local
    container_name: astra-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    ports:
      - "10350:3000" # Dagster UI (astra range)
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started
    networks: [signoz-net]
    restart: unless-stopped

  dagster-daemon:
    image: astra-dagster:local
    container_name: astra-dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started
    networks: [signoz-net]
    restart: unless-stopped

  # --- strider: the first SSR frontend (Decision I) — the template for 0011-0013 ---
  # One SSR process; the editor save runs in it as a TanStack server function
  # (writes content/layers/*.md). The /editor UI is gated to the local network at
  # the Caddy edge.

  # --- weal: the dice/host bot's roll-history + macro store (0009, Decision F) ---
  weal-postgres:
    image: postgres:16-alpine
    container_name: astra-weal-postgres
    environment:
      POSTGRES_USER: ${WEAL_PG_USERNAME:-weal}
      POSTGRES_PASSWORD: ${WEAL_PG_PASSWORD:-weal}
      POSTGRES_DB: ${WEAL_PG_DB:-weal}
    volumes:
      - weal-pg:/var/lib/postgresql/data
    ports:
      - "10362:5432" # weal dice/funcs store (astra range) — for the P6 SQLite→PG migration
    networks: [signoz-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WEAL_PG_USERNAME:-weal} -d ${WEAL_PG_DB:-weal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # weal-bot: the dice/host Discord bot (discord.js gateway + internal speak API).
  # No published port — Discord dials outbound; the speak API binds 127.0.0.1 only.
  # Won't fully run until the SOPS secrets (discord token, weal_token) are provisioned.
  weal-bot:
    build:
      context: ..
      dockerfile: apps/weal-bot/Dockerfile
    image: astra-weal-bot:local
    container_name: astra-weal-bot
    depends_on:
      weal-postgres:
        condition: service_healthy
    # SOPS secrets injected as env by `just up` (Decision E); config's env-override
    # resolves the `ref="sops:KEY"`s in-container. Empty when not run via `just up`
    # (degrades). dice_feed_url is not provisioned yet (lands at cutover) → unset.
    environment:
      WEAL_DISCORD_KEY: ${WEAL_DISCORD_KEY:-}
      WEAL_TOKEN: ${WEAL_TOKEN:-}
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:10203/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # weal-overlay: the dice-roll OBS overlay (SSE). Behind Caddy with flush_interval -1.
  weal-overlay:
    build:
      context: ..
      dockerfile: apps/weal-overlay/Dockerfile
    image: astra-weal-overlay:local
    container_name: astra-weal-overlay
    command: ["bun", "run", "start"]
    # Shared weal↔overlay token (Decision E env injection via `just up`).
    environment:
      WEAL_TOKEN: ${WEAL_TOKEN:-}
    ports:
      - "10361:10360" # weal-overlay (astra range); strider holds 10360
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:10360/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  strider:
    build:
      context: ..
      dockerfile: apps/strider/Dockerfile
      args:
        APP: strider # the one knob in the templated frontend Dockerfile
    image: astra-strider:local
    container_name: astra-strider
    command: ["bun", "run", "start"]
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10360:10360" # strider SSR (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:10360/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- akasha-frontend: the wiki read-surface (0011) — SSR Compose service (Decision
  # I), the second 0011-0013 frontend on the strider template. Build-time snapshot +
  # transcripts + Pagefind index baked into the image; no live backend (Decision D). ---
  akasha-frontend:
    build:
      context: ..
      dockerfile: apps/akasha-frontend/Dockerfile
      args:
        APP: akasha-frontend # the one knob in the templated frontend Dockerfile
    image: astra-akasha-frontend:local
    container_name: astra-akasha-frontend
    command: ["bun", "run", "start"]
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10365:10365" # akasha-frontend SSR (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:10365/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- mouthpiece-frontend: the podcast read-surface (0012) — SSR Compose service
  # (Decision I), the third 0011-0013 frontend on the strider/akasha template. The
  # episode catalog (snapshot) is baked into the image; the 173 MB of episode audio is
  # a runtime VOLUME (mouthpiece-audio), served same-origin at /audio/ — never in the
  # image layer (D2). Seed the volume with `just mouthpiece-seed`. ---
  mouthpiece-frontend:
    build:
      context: ..
      dockerfile: apps/mouthpiece-frontend/Dockerfile
      args:
        APP: mouthpiece-frontend # the one knob in the templated frontend Dockerfile
    image: astra-mouthpiece-frontend:local
    container_name: astra-mouthpiece-frontend
    command: ["bun", "run", "start"]
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10366:10366" # mouthpiece-frontend SSR (astra range) — also reachable directly
    volumes:
      - mouthpiece-audio:/audio:ro # matches kdl mouthpiece-frontend.audio-dir; served at /audio/<id>.mp3
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:10366/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- orator: the music bot's library store (0010, Decision F) ---
  orator-postgres:
    image: postgres:16-alpine
    container_name: astra-orator-postgres
    environment:
      POSTGRES_USER: ${ORATOR_PG_USERNAME:-orator}
      POSTGRES_PASSWORD: ${ORATOR_PG_PASSWORD:-orator}
      POSTGRES_DB: ${ORATOR_PG_DB:-orator}
    volumes:
      - orator-pg:/var/lib/postgresql/data
    ports:
      - "10364:5432" # orator music-library store (astra range)
    networks: [signoz-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORATOR_PG_USERNAME:-orator} -d ${ORATOR_PG_DB:-orator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # orator-backend: the Discord music service — Bun.serve REST + voice + ingest +
  # the served operator SPA. Behind Caddy at orator.iridi.cc. ALL runtime config is
  # read from config.kdl via @astra/config (no config env — config-single-source);
  # the only mount is the audio/data volume (kdl `orator.data-dir = /data`). The bot
  # is optional: without resolved SOPS secrets it runs web+library, playback → 503.
  orator-backend:
    build:
      context: ..
      dockerfile: apps/orator-backend/Dockerfile
    image: astra-orator-backend:local
    container_name: astra-orator-backend
    depends_on:
      orator-postgres:
        condition: service_healthy
    # SOPS secrets injected as env by `just up` (Decision E) → config env-override
    # resolves them in-container. Empty when not run via `just up` (bot off, 503).
    environment:
      ORATOR_DISCORD_KEY: ${ORATOR_DISCORD_KEY:-}
      ORATOR_DISCORD_CLIENT_ID: ${ORATOR_DISCORD_CLIENT_ID:-}
      ORATOR_DISCORD_CLIENT_SECRET: ${ORATOR_DISCORD_CLIENT_SECRET:-}
      ORATOR_SESSION_SECRET: ${ORATOR_SESSION_SECRET:-}
    volumes:
      - orator-audio:/data # matches kdl orator.data-dir; audio under /data/audio
    ports:
      - "10363:10363" # orator-backend (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:10363/api/v1/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# The production edge is the shared HOST reverse proxy at /ruby/data/reverse-proxy
# (it imports this repo's root sites.caddyfile; reload via `just caddy-reload`), so
# the substrate runs no Caddy of its own — services are reachable on their
# published host ports (Dagster 10350, SigNoz 10351, strider 10360).

volumes:
  dagster-pg:
    name: astra-dagster-pg
  weal-pg:
    name: astra-weal-pg
  orator-pg:
    name: astra-orator-pg
  orator-audio:
    name: astra-orator-audio
  mouthpiece-audio:
    name: astra-mouthpiece-audio

networks:
  signoz-net:
    name: signoz-net
