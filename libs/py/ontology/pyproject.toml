[project]
name = "astra-ontology"
version = "0.0.0"
description = "Typed accessor over ontology-being's KDL — players→PCs, campaigns, colors, host identities (Pydantic)."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-lexicon",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_ontology"]

[tool.uv.sources]
astra-config = { workspace = true }
astra-lexicon = { workspace = true }
