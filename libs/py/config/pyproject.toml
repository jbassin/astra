[project]
name = "astra-config"
version = "0.0.0"
description = "KDL config loader + lazy SOPS secret-ref resolver → typed Pydantic config (parse-at-edge, Decision E)."
requires-python = ">=3.12"
dependencies = [
    "ckdl>=1.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_config"]
