[project]
name = "astra-ontology-entity"
version = "0.0.0"
description = "Owns entity.kdl (the typed in-world noun registry for heartwood) + the host-run seed/regen entry-point; the typed model + seeding live in astra-ontology."
requires-python = ">=3.12"
dependencies = [
    "astra-lexicon",
    "astra-observe",
    "astra-ontology",
    "astra-ontology-being",
]

[project.scripts]
astra-ontology-entity-seed = "astra_ontology_entity.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_ontology_entity"]

[tool.uv.sources]
astra-lexicon = { workspace = true }
astra-observe = { workspace = true }
astra-ontology = { workspace = true }
astra-ontology-being = { workspace = true }
