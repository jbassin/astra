[project]
name = "astra-lexicon"
version = "0.0.0"
description = "Canonical-names vocabulary + phonetic matchers + corrections — the matching substrate shared by linguist (ASR correction) and heartwood (entity resolution)."
requires-python = ">=3.12"
dependencies = [
    "metaphone>=0.6",
    "rapidfuzz>=3",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_lexicon"]
