[project]
name = "astra-vellum-lang"
version = "0.0.0"
description = "Metadata-only vellum extractor (D2): frontmatter + crossref set. TS owns the full AST; this feeds akasha-backend's page index + backlink graph."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "astra-observe",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_vellum_lang"]

[tool.uv.sources]
astra-observe = { workspace = true }
