[tool.uv.workspace]
# Membership follows location (ADR 0015): a Python app lives at apps/<domain>/py/ and
# is a member because the glob matches it. uv rejects a glob-matched directory that
# lacks a `pyproject.toml`, so never create an empty apps/<domain>/py/. `apps/*/tools`
# holds hand-run tools the Dagster image does not install (ADR 0023). `dagster` is the
# code location (astra-pipeline), so its deps are locked with everything else.
members = ["apps/*/py", "apps/*/tools", "libs/py/*", "ontology/*", "dagster"]

[tool.uv.sources]
# The one sources table: every member inherits it, so a member's pyproject.toml lists an
# astra-* dependency by name only and never repeats this. It names every member that is a
# package (all but astra-pipeline, which is `package = false`); a new member goes here.
astra-akasha-backend = { workspace = true }
astra-assay = { workspace = true }
astra-config = { workspace = true }
astra-heartwood-backend = { workspace = true }
astra-lexicon = { workspace = true }
astra-linguist = { workspace = true }
astra-llm = { workspace = true }
astra-mouthpiece-backend = { workspace = true }
astra-mouthpiece-tools = { workspace = true }
astra-observe = { workspace = true }
astra-ops = { workspace = true }
astra-ontology = { workspace = true }
astra-ontology-being = { workspace = true }
astra-ontology-config = { workspace = true }
astra-ontology-entity = { workspace = true }
astra-pipeline-resources = { workspace = true }
astra-scribe = { workspace = true }
astra-sessions = { workspace = true }
astra-smoke = { workspace = true }
astra-smoke-substrate = { workspace = true }
astra-vellum-lang = { workspace = true }

[tool.uv]
# Workspace-wide dev tooling — the Astral Python stack.
#   ruff = lint + format, ty = type check (preview; pinned), pytest = tests.
dev-dependencies = [
    "ruff>=0.8",
    "ty==0.0.51",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["libs/py", "apps", "ontology", "dagster", "deploy/tests", "scripts"]
# importlib mode: test modules are not put on sys.path, so a test can't import a sibling
# test module by bare name and same-named test files in different packages don't collide.
# Shared test helpers live in a package (a tests/__init__.py) and use relative imports.
addopts = "-q --import-mode=importlib"

[tool.ty.environment]
# Production (the Dagster image), CI and dev all run 3.12 (.python-version).
python-version = "3.12"

[tool.ty.src]
# libs/rust/ holds standalone PEP 723 scripts whose dependencies (e.g. icepool)
# live in their own inline environments, not in the workspace venv.
# thoughts/archive holds archived source that is never edited or run.
exclude = ["libs/rust/", "thoughts/archive/"]
