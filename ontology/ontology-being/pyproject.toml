[project]
name = "astra-ontology-being"
version = "0.0.0"
description = "Owns being.kdl (the META truth store) + the cross-language canonical JSON; load() returns the typed Being."
requires-python = ">=3.12"
dependencies = [
    "astra-ontology",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_ontology_being"]

[tool.uv.sources]
astra-ontology = { workspace = true }
