# Astra deploy substrate (roadmap Decision H):
#   - SigNoz (ClickHouse + zookeeper + UI + otel-collector + schema migrator),
#     vendored under deploy/signoz/ and `include`d so its own relative mounts
#     (../common/...) resolve correctly. Published ports remapped into 10350-10399.
#   - Dagster control plane (Postgres + code location + webserver + daemon).
#   - The Node services (SSR frontends, bots, overlay, render, portal) and host exporters.
# SigNoz/OTel is the single pane across all of them. Deploy with `just deploy [service...]`
# (deploy/deploy.sh): it builds from the deploy checkout at a pushed sha and injects the
# SOPS secrets. A bare `docker compose up` starts services with every secret empty.
#
# Shared blocks are `x-*` extension fields merged with `<<:`; a service states only what
# differs. `docker compose -f deploy/docker-compose.yml config` prints the expanded result.
name: astra

include:
  - path: signoz/docker/docker-compose.yaml

# Every astra service: the restart policy. Networks are least-privilege (0037 OPS-8, SEC-13);
# the `networks:` block at the end of this file maps who joins which net and why. A YAML
# merge does not merge lists, so a service that needs more than its anchor's networks lists
# all of them. node-exporter and smart-exporter set their own network_mode instead.
x-astra-service: &astra-service
  restart: unless-stopped

# The astra app containers run as the host owner (uid 1000): node:24-slim ships a uid-1000
# `node` user and the Dagster image chowns /opt/dagster to 1000, so writes into the bind
# mounts land host-owned. Postgres and SigNoz keep their own uid. Every Node app exports
# OTLP to the collector, so `telemetry` is its default network.
x-astra-app: &astra-app
  <<: *astra-service
  user: "1000:1000"
  networks: [telemetry]

# The Postgres stores: PGDATA is an identical-layout bind mount from the data root. No
# `user:`, because the postgres entrypoint owns PGDATA as uid 70 (the dirs stay 70:70, mode
# 0700). Each store sets its own `<app>-db` network, shared only with its app.
x-astra-postgres: &astra-postgres
  <<: *astra-service
  image: postgres:16-alpine

# The Dagster trio: `pipeline` carries webserver/daemon -> code-server gRPC (:4000) and their
# OTLP to the collector; `dagster-db` reaches dagster-postgres. Each run's container
# (dagster.yaml run_launcher, ADR 0030) joins the same two nets: it writes runs and events
# to Postgres and calls the provider APIs.
x-dagster-networks: &dagster-networks [pipeline, dagster-db]

x-pg-healthcheck: &pg-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

# The Node services' healthcheck shape; each service adds its `test` (node:24-slim has a
# global fetch, so the probe needs no extra deps).
x-node-healthcheck: &node-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5

# The Dagster services' healthcheck shape; each service adds its `test`. Every probe starts
# a Python process that imports Dagster (a few seconds), and the code server loads the
# whole asset graph before it answers, hence the timeout and the start period.
x-dagster-healthcheck: &dagster-healthcheck
  interval: 15s
  timeout: 20s
  retries: 5
  start_period: 90s

# Labels on every image built here (0037 OPS-3), so `docker inspect` answers "which commit
# is this container running". deploy/deploy.sh exports ASTRA_REVISION (the full sha it
# checked out) and ASTRA_REVISION_DATE (that commit's date — not the wall clock, so
# redeploying the same sha leaves the image config, and so the containers, unchanged). A
# build outside deploy.sh is labelled `unknown`.
x-build-labels: &build-labels
  org.opencontainers.image.revision: ${ASTRA_REVISION:-unknown}
  org.opencontainers.image.created: ${ASTRA_REVISION_DATE:-unknown}

# Every Node service builds deploy/node.Dockerfile from the repo root; its `args` (APP,
# ENTRY, CONTENT, RUNTIME) pick the app, and the image's CMD runs `$APP_ENTRY`. Services
# set no `command:`, so the entry has one source (the 2026-10-24 outage was a compose
# command that had drifted from the image).
x-node-build: &node-build
  labels: *build-labels
  context: ..
  dockerfile: deploy/node.Dockerfile

# Every bind mount uses the long syntax with create_host_path: false, so a missing host dir
# fails the deploy instead of Docker creating it empty and root-owned. deploy.sh
# init_artifacts creates the data root's dirs as uid 1000; `just doctor` checks them.
x-bind: &bind
  type: bind
  bind:
    create_host_path: false

x-dagster-env: &dagster-env
  DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME:-dagster}
  DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
  DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
  # Pipeline secrets injected as env by `just up` (Decision E) so the assets'
  # LLM/transcription calls resolve their `ref="sops:KEY"`s in-container (the code
  # server, daemon, and run workers all inherit this anchor).
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  # mouthpiece's clean/enrich/script calls run on GLM 5.3 via OpenRouter
  # (mouthpiece.model); linguist's chronicle uses GLM 5.2 (llm.default-model). litellm
  # reads this key from env.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # The run launcher's image and networks (dagster.yaml run_launcher): the image this file
  # builds and the two nets the trio is on, by their Docker names (project `astra`).
  DAGSTER_RUN_IMAGE: astra-dagster:local
  DAGSTER_RUN_NETWORK_PIPELINE: astra_pipeline
  DAGSTER_RUN_NETWORK_DB: astra_dagster-db

# Pipeline data dirs bind-mounted into dagster-code (sensors and schedules read them) and,
# through dagster.yaml's run_launcher `volumes` (the same list), into every run's container
# (the assets write them), so the assets' disk-cache seams persist (and are shared with
# host-dev `uv run dagster dev`, which uses the same host dirs). Every mount is
# IDENTICAL-PATH (container path == host path): the code reads each path from the baked
# config.kdl (data.root / data.content-root + the relative data paths), so the same
# resolved path must exist inside the container. Every host path in this file is under
# the one data root /ruby/data/astra-state (config.kdl data.root, whose comment lists the
# layout); none is in a code checkout. Moving the data = changing config.kdl + these
# mount pairs. The published datasets live in the astra-data clone
# (data.content-root, /ruby/data/astra-state/astra-data): the run workers write
# the linguist datasets there and the host linguist-commit timer commits + pushes them.
# The clone must exist before a deploy (a missing bind source fails the deploy);
# deploy.sh creates the other source dirs as uid 1000 (init_artifacts).
x-dagster-volumes: &dagster-pipeline-volumes
  # scribe.incoming-path — the local Craig drop dir (zips copied here from the Drive
  # fuse mount, which Docker can't bind-mount). scribe reads + extracts, never deletes.
  - { <<: *bind, source: /ruby/data/astra-state/scribe/incoming, target: /ruby/data/astra-state/scribe/incoming }
  - { <<: *bind, source: /ruby/data/astra-state/scribe/data, target: /ruby/data/astra-state/scribe/data }
  - { <<: *bind, source: /ruby/data/astra-state/scribe/tmp, target: /ruby/data/astra-state/scribe/tmp }
  # linguist.script-path — operator state (the campaign-matched context).
  - { <<: *bind, source: /ruby/data/astra-state/linguist/script, target: /ruby/data/astra-state/linguist/script }
  # data.linguist-{transcripts,data,timeline} — in the astra-data clone.
  - { <<: *bind, source: /ruby/data/astra-state/astra-data/linguist/transcripts, target: /ruby/data/astra-state/astra-data/linguist/transcripts }
  - { <<: *bind, source: /ruby/data/astra-state/astra-data/linguist/data, target: /ruby/data/astra-state/astra-data/linguist/data }
  - { <<: *bind, source: /ruby/data/astra-state/astra-data/linguist/timeline, target: /ruby/data/astra-state/astra-data/linguist/timeline }
  - { <<: *bind, source: /ruby/data/astra-state/mouthpiece/episodes, target: /ruby/data/astra-state/mouthpiece/episodes }
  # The akasha wiki, LIVE and read-only (0035 D35-3): the producer (session_brief) and the
  # script fallback's grounding read it. Before this the container read the copy baked in
  # at the last `just up`, missing everything heartwood published since. Nothing in Dagster
  # writes here (the akasha snapshot runs on the host, because it needs node).
  - { <<: *bind, source: /ruby/data/astra-state/astra-data/akasha/content, target: /ruby/data/astra-state/astra-data/akasha/content, read_only: true }
  # data.entity-registry, read-only: session_brief's producer resolves names against it
  # (astra_ontology_entity.resolve). The directory (not the file) is mounted so a git
  # checkout/rebase in the clone that replaces entity.kdl's inode stays visible.
  - { <<: *bind, source: /ruby/data/astra-state/astra-data/entity, target: /ruby/data/astra-state/astra-data/entity, read_only: true }
  # heartwood.requests-path (0036): session_wiki files <date>.request.json here and waits for
  # the host heartwood-request unit's <date>.result.json. Identical path on both sides; the
  # dir is created by deploy.sh init_artifacts as uid 1000.
  - { <<: *bind, source: /ruby/data/astra-state/heartwood/requests, target: /ruby/data/astra-state/heartwood/requests }

# The daemon mounts only the host's Docker socket: it launches each run's container, checks
# its health and stops it on a terminate (dagster.yaml run_launcher, ADR 0030). The socket is
# root on the host, so only the daemon mounts it: never dagster-code, a run container or the
# webserver, which anyone on the LAN reaches without auth. The UI's "Terminate" therefore
# cannot stop a run's container; `just pipeline-terminate <run-id>` runs the cancel inside
# the daemon. Neither the daemon nor the webserver runs asset code (sensors and schedules
# run in dagster-code, assets in the run containers), so neither needs the pipeline binds.
# The daemon runs as uid 1000 and joins the socket's group: deploy.sh exports its gid as
# DOCKER_GID (the default is this host's `docker` group).
x-dagster-daemon-volumes: &dagster-daemon-volumes
  - { <<: *bind, source: /var/run/docker.sock, target: /var/run/docker.sock }

services:
  # --- Dagster: the batch-pipeline control plane ---
  dagster-postgres:
    <<: *astra-postgres
    container_name: astra-dagster-postgres
    networks: [dagster-db]
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/postgres/dagster, target: /var/lib/postgresql/data }
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USERNAME:-dagster} -d ${DAGSTER_PG_DB:-dagster}"]

  # The three Dagster services share one image (no CMD), so each sets its own command.
  dagster-code:
    <<: *astra-app
    build:
      labels: *build-labels
      # Repo root (like the Node services): the image `uv sync`s the Python workspace so
      # definitions.py can import the real pipeline packages.
      context: ..
      dockerfile: dagster/Dockerfile
    image: astra-dagster:local
    container_name: astra-dagster-code
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-f", "definitions.py"]
    networks: *dagster-networks
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    healthcheck:
      <<: *dagster-healthcheck
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]

  dagster-webserver:
    <<: *astra-app
    image: astra-dagster:local
    container_name: astra-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    ports:
      - "10350:3000" # Dagster UI (astra range)
    networks: *dagster-networks
    environment: *dagster-env
    healthcheck:
      <<: *dagster-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:3000/server_info', timeout=5)"]
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy

  dagster-daemon:
    <<: *astra-app
    image: astra-dagster:local
    container_name: astra-dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    networks: *dagster-networks
    environment: *dagster-env
    volumes: *dagster-daemon-volumes
    group_add: ["${DOCKER_GID:-999}"]
    # Every daemon (sensors, schedules, run queue, run monitoring) heartbeat in the last
    # 5 minutes. The daemon's own tolerance stays at the 30-minute default, so a slow tick
    # does not restart it. A fresh daemon passes on its predecessor's heartbeats at first.
    healthcheck:
      <<: *dagster-healthcheck
      test: ["CMD-SHELL", "DAGSTER_DAEMON_HEARTBEAT_TOLERANCE=300 dagster-daemon liveness-check"]
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy

  # --- weal: the dice/host bot's roll-history + macro store (0009, Decision F) ---
  weal-postgres:
    <<: *astra-postgres
    container_name: astra-weal-postgres
    networks: [weal-db]
    environment:
      POSTGRES_USER: ${WEAL_PG_USERNAME:-weal}
      POSTGRES_PASSWORD: ${WEAL_PG_PASSWORD:-weal}
      POSTGRES_DB: ${WEAL_PG_DB:-weal}
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/postgres/weal, target: /var/lib/postgresql/data }
    ports:
      - "10362:5432" # weal dice/funcs store (astra range) — for the P6 SQLite→PG migration
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${WEAL_PG_USERNAME:-weal} -d ${WEAL_PG_DB:-weal}"]

  # weal-bot: the dice/host Discord bot (discord.js gateway). No published port: Discord
  # dials outbound, and the healthcheck endpoint binds 127.0.0.1 inside the container.
  weal-bot:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: weal/bot
        ENTRY: src/index.ts
    image: astra-weal-bot:local
    container_name: astra-weal-bot
    # weal-db: its store; weal-feed: it POSTs rolls to weal-overlay (weal.feed-ws-url).
    networks: [telemetry, weal-db, weal-feed]
    depends_on:
      weal-postgres:
        condition: service_healthy
    # SOPS secrets injected as env by `just up` (Decision E); config's env-override
    # resolves the `ref="sops:KEY"`s in-container. Empty when not run via `just up`
    # (degrades).
    environment:
      WEAL_DISCORD_KEY: ${WEAL_DISCORD_KEY:-}
      WEAL_TOKEN: ${WEAL_TOKEN:-}
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://127.0.0.1:10203/health').then(r=>process.exit(r.ok?0:1))"]

  # weal-overlay: the dice-roll OBS overlay (SSE). Behind Caddy with flush_interval -1.
  weal-overlay:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: weal/overlay
    image: astra-weal-overlay:local
    container_name: astra-weal-overlay
    networks: [telemetry, weal-feed]
    # Shared weal↔overlay token (Decision E env injection via `just up`).
    environment:
      WEAL_TOKEN: ${WEAL_TOKEN:-}
    ports:
      - "10361:10361" # weal-overlay (astra range): config weal-overlay.port
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10361/').then(r=>process.exit(r.ok?0:1))"]

  # menhir: the Kahoot-style session-opener quiz (0031). SSE behind Caddy with
  # flush_interval -1. No secrets (no auth, D31-9's hostToken is minted per game).
  # Results JSONL rides an IDENTICAL-PATH rw bind mount (host path == container
  # path — plain config fields have no env override, the D29-53 convention);
  # deploy.sh init_artifacts pre-creates the dir as uid 1000.
  menhir:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: menhir/web
    image: astra-menhir:local
    container_name: astra-menhir
    ports:
      - "10375:10375"
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/menhir, target: /ruby/data/astra-state/menhir }
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10375/healthz').then(r=>process.exit(r.ok?0:1))"]

  # --- strider: the first SSR frontend (Decision I), the template for 0011-0013. One SSR
  # process; the editor save runs in it as a TanStack server function (writes
  # content/layers/*.md). The /editor UI is gated to the local network at the Caddy edge. ---
  strider:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: strider/web
    image: astra-strider:local
    container_name: astra-strider
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10360:10360" # strider SSR (astra range) — also reachable directly
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10360/').then(r=>process.exit(r.ok?0:1))"]

  # --- akasha-frontend: the wiki read-surface (0011) — SSR Compose service (Decision
  # I), the second 0011-0013 frontend on the strider template. Build-time snapshot +
  # transcripts + Pagefind index baked into the image; no live backend (Decision D).
  # The combined session audio each transcript plays is a runtime bind mount (~31 GB),
  # served same-origin at /audio/<date>.mp3 — never in the image (D2). Seed with
  # `just akasha-seed`. ---
  akasha-frontend:
    <<: *astra-app
    build:
      <<: *node-build
      # The published datasets the build bakes in (COPY --from=astra-data), never read
      # from the code repo. deploy.sh exports ASTRA_DATA_CONTEXT = a clean export of the
      # astra-data clone's HEAD (committed content only); the default fails on purpose, so a
      # build outside deploy.sh cannot bake the clone's uncommitted files.
      additional_contexts:
        astra-data: ${ASTRA_DATA_CONTEXT:-/nonexistent/build-only-via-deploy.sh}
      args:
        APP: akasha/web
        CONTENT: akasha
    image: astra-akasha-frontend:local
    container_name: astra-akasha-frontend
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10365:10365" # akasha-frontend SSR (astra range) — also reachable directly
    # Session audio from the data root at container path /audio (kdl
    # akasha-frontend.audio-dir), served at /audio/<date>.mp3.
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/audio/akasha, target: /audio, read_only: true }
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10365/').then(r=>process.exit(r.ok?0:1))"]

  # --- codex (0029): the PF2e compendium/rules browser — SSR Compose service
  # (Decision I), on the runtime-mount model (not akasha's baked one): nothing
  # content-shaped is baked into the image — the corpus + Pagefind search index
  # arrive as immutable releases on a read-only bind mount, request-time reads (D29-31).
  # D29-53: the mount is an IDENTICAL host-path==container-path bind, the Dagster
  # pipeline-volume convention applied to a frontend for the first time — codex's
  # `codex.data-path` (config.kdl) is a host-absolute path consumed VERBATIM by
  # both `pnpm start` on the host and this container, and plain config fields have
  # no env-override mechanism, so identical-path is the only way to satisfy
  # config-single-source without a per-environment fork. `data/snapshots/` (601 MB,
  # runtime-unreferenced ingest input) and `data/tmp/` deliberately stay OUT of the
  # container — only the releases dir below. No `environment:` — no secrets, and
  # the OTLP endpoint comes from config's in-cluster default. ---
  codex:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: codex/web
    image: astra-codex:local
    container_name: astra-codex
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10374:10374" # codex SSR (astra range) — also reachable directly
    # D29-53: identical-path read-only bind mount (host path == container path) of the
    # releases dir under codex.data-path (config.kdl) = /ruby/data/astra-state/codex/data.
    # `just codex-build` writes each release to releases/<id>/ and swaps the relative
    # releases/current symlink, which the server follows per request (no restart, no
    # remount). deploy.sh init_artifacts creates the dir as uid 1000. With no current
    # release the server exits at startup (it never serves the fixture) until
    # `codex-build` (or the one-time `codex-migrate-releases`) runs.
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/codex/data/releases, target: /ruby/data/astra-state/codex/data/releases, read_only: true }
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10374/').then(r=>process.exit(r.ok?0:1))"]

  # --- mouthpiece-frontend: the podcast read-surface (0012) — SSR Compose service
  # (Decision I), the third 0011-0013 frontend on the strider/akasha template. The
  # episode catalog (snapshot) is baked into the image; the 173 MB of episode audio is
  # a runtime bind mount, served same-origin at /audio/ — never in the image layer (D2).
  # Seed it with `just mouthpiece-seed`. ---
  mouthpiece-frontend:
    <<: *astra-app
    build:
      <<: *node-build
      # The published datasets the build bakes in; see akasha-frontend.
      additional_contexts:
        astra-data: ${ASTRA_DATA_CONTEXT:-/nonexistent/build-only-via-deploy.sh}
      args:
        APP: mouthpiece/web
        CONTENT: mouthpiece
    image: astra-mouthpiece-frontend:local
    container_name: astra-mouthpiece-frontend
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10366:10366" # mouthpiece-frontend SSR (astra range) — also reachable directly
    # Episode audio from the data root at container path /audio (kdl
    # mouthpiece-frontend.audio-dir), served at /audio/<id>.mp3.
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/audio/mouthpiece, target: /audio, read_only: true }
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10366/').then(r=>process.exit(r.ok?0:1))"]

  # --- vellum-frontend: the document-forge editor (0013) — SSR Compose service
  # behind Caddy (Decision I). The editor route is client-only (ssr:false); the PNG
  # export POSTs same-origin /render, which Caddy routes to vellum-render below. ---
  vellum-frontend:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: vellum/web
    image: astra-vellum-frontend:local
    container_name: astra-vellum-frontend
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10367:10367" # vellum-frontend SSR (astra range) — also reachable directly
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10367/').then(r=>process.exit(r.ok?0:1))"]

  # --- vellum-render: the PNG render service (0013, D2) — a SEPARATE unit, the first
  # browser-in-a-container in astra (warm Chromium, egress-blocked, semaphore-gated).
  # Caddy routes vellum.iridi.cc/render + /health here. The Dockerfile chowns
  # /ms-playwright so the (non-root) Chromium can read its browser bundle; the profile is
  # an ephemeral /tmp dir; --no-sandbox. ---
  vellum-render:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: vellum/render
        ENTRY: src/server.ts
        RUNTIME: chromium
    image: astra-vellum-render:local
    container_name: astra-vellum-render
    # No PORT env — serviceName/port come from config.kdl (config-single-source).
    ports:
      - "10368:10368" # vellum-render (astra range) — reached same-origin via Caddy /render
    healthcheck:
      <<: *node-healthcheck
      # /health reports the warm-Chromium readiness; start_period covers the launch.
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10368/health').then(r=>r.json()).then(j=>process.exit(j.ready?0:1))"]
      start_period: 25s

  # --- orator: the music bot's library store (0010, Decision F) ---
  orator-postgres:
    <<: *astra-postgres
    container_name: astra-orator-postgres
    networks: [orator-db]
    environment:
      POSTGRES_USER: ${ORATOR_PG_USERNAME:-orator}
      POSTGRES_PASSWORD: ${ORATOR_PG_PASSWORD:-orator}
      POSTGRES_DB: ${ORATOR_PG_DB:-orator}
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/postgres/orator, target: /var/lib/postgresql/data }
    ports:
      - "10364:5432" # orator music-library store (astra range)
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${ORATOR_PG_USERNAME:-orator} -d ${ORATOR_PG_DB:-orator}"]

  # orator-backend: the Discord music service — srvx REST + voice + ingest + the
  # served operator SPA. Behind Caddy at orator.iridi.cc. ALL runtime config is read from
  # config.kdl via @astra/config (no config env — config-single-source); the only
  # mount is the audio/data dir (kdl `orator.data-dir = /data`, mounted rw, so ingest
  # writes land host-owned). The Discord bot is optional: without its SOPS keys it runs
  # web+library, playback → 503. ORATOR_SESSION_SECRET is required (startup fails without).
  orator-backend:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: orator/bot
        ENTRY: src/index.ts
        RUNTIME: ffmpeg
    image: astra-orator-backend:local
    container_name: astra-orator-backend
    networks: [telemetry, orator-db]
    depends_on:
      orator-postgres:
        condition: service_healthy
    # SOPS secrets injected as env by `just up` (Decision E) → config env-override
    # resolves them in-container.
    environment:
      ORATOR_DISCORD_KEY: ${ORATOR_DISCORD_KEY:-}
      ORATOR_DISCORD_CLIENT_ID: ${ORATOR_DISCORD_CLIENT_ID:-}
      ORATOR_DISCORD_CLIENT_SECRET: ${ORATOR_DISCORD_CLIENT_SECRET:-}
      ORATOR_SESSION_SECRET: ${ORATOR_SESSION_SECRET:-}
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/audio/orator, target: /data } # kdl orator.data-dir; audio under /data/audio
    ports:
      - "10363:10363" # orator-backend (astra range) — also reachable directly
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10363/api/v1/health').then(r=>process.exit(r.ok?0:1))"]

  # --- harrow: the tarot deck reader (0017) — SSR Compose service behind Caddy
  # (Decision I), a backend-less sibling of strider. No DB, no audio/asset volume
  # (every card glyph is inline SVG). Port/service-name from config.kdl. ---
  harrow:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: harrow/web
    image: astra-harrow:local
    container_name: astra-harrow
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10369:10369" # harrow SSR (astra range) — also reachable directly
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10369/').then(r=>process.exit(r.ok?0:1))"]

  # --- ledger: the astra landing page (0018) — the simplest SSR frontend, a sibling
  # of harrow. One homepage: a gothic card grid linking the player-facing sites. No
  # backend, no DB, no volume — the linked URLs are baked from each site's config
  # public-origin at build time. Port/service-name from config.kdl. ---
  ledger:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: ledger/web
    image: astra-ledger:local
    container_name: astra-ledger
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10370:10370" # ledger SSR (astra range) — also reachable directly
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10370/').then(r=>process.exit(r.ok?0:1))"]

  # --- portal (0023): the FoundryVTT MCP+WS bridge server. TS on the orator-backend
  # template (D3, no build step for the server itself — the Dockerfile DOES build the
  # Foundry module, tsdown -> module/dist/main.js, packaged at runtime by the server
  # itself into an installable zip, D11). No frontend/SSR here: portal-server binds
  # /health, /mcp (Streamable-HTTP, D4/D10), /ws (the bridge, D6), and
  # /module/{module.json,portal.zip} (S6 install-by-Manifest-URL). Behind Caddy at
  # portal.iridi.cc; nothing works unless the GM has "Faerrin" launched (the liveness
  # constraint — bridge-status surfaces "offline", never a hang). ---
  portal:
    <<: *astra-app
    build:
      <<: *node-build
      target: portal # adds the built Foundry module
      args:
        APP: portal/server
        ENTRY: src/index.ts
    image: astra-portal:local
    container_name: astra-portal
    # SOPS secrets injected as env by `just up` (Decision E); config's env-override
    # resolves the D6 `ref="sops:..."` keys in-container, plus the 0028 D28-1 player
    # key. All three are load-bearing (index.ts throws at startup if any is
    # unresolved — no degraded mode, unlike orator's optional Discord token).
    environment:
      PORTAL_MCP_API_KEY: ${PORTAL_MCP_API_KEY:-}
      # NB: the env-override name is the SOPS key upper-cased (portal_player_api_key →
      # PORTAL_PLAYER_API_KEY), NOT the kdl field name — the mismatch crash-looped the
      # 0028 S4 deploy.
      PORTAL_PLAYER_API_KEY: ${PORTAL_PLAYER_API_KEY:-}
      PORTAL_BRIDGE_API_KEY: ${PORTAL_BRIDGE_API_KEY:-}
    # 0025 OAuth state (registered claude.ai clients + hashed tokens) bind-mounted
    # from the data root so connections survive redeploys; container path matches kdl
    # portal.oauth-state-path (/data/oauth/state.json). Writes land 1000:1000.
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/portal-oauth, target: /data/oauth }
    ports:
      - "10372:10372" # portal (astra range) — also reachable directly
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10372/health').then(r=>process.exit(r.ok?0:1))"]

  # --- portal-headless (0027): the supervised headless-Chromium GM session — a
  # dedicated Foundry account ("Portal", full GM) permanently logged into the live
  # pf2e "Faerrin" world through the public edge, so portal's MCP tools work with no
  # human browser tab open. A SEPARATE unit from portal-server (D27-5): health-only,
  # not edge-routed (no Caddy entry), on `telemetry` alone; it reaches Foundry through the
  # public edge (D27-3), not a compose network. Follows
  # vellum-render's browser-in-a-container lifecycle with D27-10's long-lived-tab
  # deltas: `shm_size` (Docker's 64MB `/dev/shm` default is the known Chromium OOM
  # source for a process-life-long page) and a generous `start_period` (Chromium warm-up
  # + first navigation + `/join`). ---
  portal-headless:
    <<: *astra-app
    build:
      <<: *node-build
      args:
        APP: portal/headless
        ENTRY: src/index.ts
        RUNTIME: chromium
    image: astra-portal-headless:local
    container_name: astra-portal-headless
    shm_size: "1gb"
    # SOPS secret injected as env by `just up` (Decision E); config's env-override
    # resolves the D27-13 `ref="sops:foundry_portal_gm_password"` key in-container.
    # Load-bearing (index.ts throws at startup if unresolved, mirroring portal's two
    # keys) — a dummy value is fine for non-live acceptance runs, since D27-6's
    # classifier never reaches the login step against a world-down/unreachable target.
    environment:
      FOUNDRY_PORTAL_GM_PASSWORD: ${FOUNDRY_PORTAL_GM_PASSWORD:-}
    ports:
      - "10373:10373" # portal-headless (astra range) — health-only, not edge-routed
    healthcheck:
      <<: *node-healthcheck
      # D27-11: process-up + browser-connected ONLY — `world-down` is a reported
      # `state`, never unhealthy (a restart can't launch a world; a restart-loop during
      # the GM's maintenance window would be noise).
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10373/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1))"]
      start_period: 30s

  # --- node-exporter: host health metrics (CPU/mem/disk/net) + ethtool NIC counters
  # (the enp4s0 rx_crc_errors / collisions that flagged the 2026-08 link flaps).
  # `network_mode: host` is required — ethtool + netdev stats only exist in the host
  # netns, so this service is on no compose network; the otel-collector scrapes it across
  # the bridge at the signoz-net gateway (172.27.0.1:9100, see the vendored
  # otel-collector-config.yaml's node-exporter job). Listens on :9100 (LAN-visible,
  # read-only metrics). Scrape interval is the receiver's global 60s. ---
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: astra-node-exporter
    network_mode: host
    pid: host
    # DBUS_...: the systemd collector reads unit states over the system bus; the
    # socket is reachable through the / bind-mount, no extra privileges needed
    # (read-only queries are allowed to any uid by dbus policy).
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave
      # smart-exporter (below) writes smartmon.prom here; served via --collector.textfile.
      - { <<: *bind, source: /ruby/data/astra-state/node-exporter/textfile, target: /textfile, read_only: true }
    command:
      - --path.rootfs=/host
      - --collector.ethtool
      # ethtool stats for the uplink NIC only — every veth/bridge would be noise.
      - --collector.ethtool.device-include=^enp4s0$
      # per-state process/thread counts (runaway/zombie detection)
      - --collector.processes
      # host service health (restarts, failed state) for the units we actually
      # care about — unfiltered it's a series per snap/mount unit, all noise
      - --collector.systemd
      - --collector.systemd.unit-include=^(caddy|coder|containerd|covert|cron|docker|gdrive|ssh|tailscaled)\.service$
      # serve any *.prom dropped by sidecars (currently: smart-exporter's SMART stats)
      - --collector.textfile.directory=/textfile
    restart: unless-stopped

  # --- smart-exporter: SMART disk health (the 14.6T media spinner + both NVMe)
  # as Prometheus textfile metrics. smartctl needs root + raw /dev access, so this
  # runs privileged as a separate sidecar and node-exporter stays unprivileged;
  # the only coupling is the shared textfile dir. No network (network_mode: none) —
  # it only writes a file. Rescans every 5 min (SMART reads are passive/cheap). ---
  smart-exporter:
    build:
      labels: *build-labels
      context: smart-exporter
    image: astra-smart-exporter:local
    container_name: astra-smart-exporter
    privileged: true
    network_mode: none
    environment:
      SMARTMON_INTERVAL: "300"
      SMARTMON_OUT: /textfile
    volumes:
      - { <<: *bind, source: /ruby/data/astra-state/node-exporter/textfile, target: /textfile }
    restart: unless-stopped

# The production edge is the shared HOST reverse proxy at /ruby/data/reverse-proxy
# (it imports this repo's root sites.caddyfile; reload via `just caddy-reload`), so
# the substrate runs no Caddy of its own — services are reachable on their
# published host ports (Dagster 10350, SigNoz 10351, strider 10360).

# The astra Postgres + audio state lives under the data root /ruby/data/astra-state,
# bind-mounted into each service (see above). The host owns it (uid 1000; Postgres PGDATA
# is uid 70 via its entrypoint). SigNoz keeps its own named volumes (declared in the
# vendored signoz include — clickhouse/sqlite/zookeeper).

# Least-privilege networks (0037 OPS-8, SEC-13). Every subnet is pinned: signoz-net to its
# live 172.27.0.0/16, the astra nets to 10.27.N.0/24 (free on this host), so a `down`/`up`
# can never hand 172.27/16 to another net. A bridge network does not filter by port,
# so every member of a net can reach every port of every other member; each net therefore
# holds only the containers that must talk. Container DNS works per net, so a service that
# shares no net with another cannot resolve it. The host-published ports are a separate path
# (ADR 0040): any container with a gateway can still reach them on the host.
networks:
  # SigNoz's own net (vendored include): ClickHouse (empty default password), zookeeper, the
  # UI and the collector. No astra service joins it. Its name and its 172.27.0.0/16 subnet
  # (pinned in both files) must not change: the collector scrapes node-exporter at the
  # gateway 172.27.0.1:9100.
  signoz-net:
    name: signoz-net
    ipam:
      config:
        - subnet: 172.27.0.0/16
  # Every Node app plus the collector: the apps export OTLP to signoz-otel-collector:4318.
  # Not internal, because it carries the apps' outbound traffic (Discord, the public edge)
  # and their published ports. The apps can reach each other here; every app port is already
  # published on the host, but the collector's unpublished pprof :1777 and health :13133 are
  # reachable only from here and `pipeline`. Same subnet as in the vendored SigNoz file.
  telemetry:
    ipam:
      config:
        - subnet: 10.27.1.0/24
  # The Dagster trio plus the collector (their OTLP). The code server's gRPC :4000 has no
  # auth and is not published, so it is reachable only from this net. Not internal: the
  # assets call Groq, ElevenLabs and OpenRouter, and the webserver publishes 10350.
  pipeline:
    ipam:
      config:
        - subnet: 10.27.2.0/24
  # One net per Postgres, joined only by its app. dagster-db is internal (no published port,
  # no outbound traffic). weal-db and orator-db cannot be internal while their Postgres ports
  # 10362/10364 stay published: Docker publishes no port on an internal-only container.
  dagster-db:
    internal: true
    ipam:
      config:
        - subnet: 10.27.3.0/24
  weal-db:
    ipam:
      config:
        - subnet: 10.27.4.0/24
  orator-db:
    ipam:
      config:
        - subnet: 10.27.5.0/24
  # weal-bot -> weal-overlay:10361 (the roll feed, token-gated).
  weal-feed:
    ipam:
      config:
        - subnet: 10.27.6.0/24
