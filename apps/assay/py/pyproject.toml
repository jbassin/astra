[project]
name = "astra-assay"
version = "0.0.0"
description = "assay — PF2e spell power scoring (a damage ladder plus comparables, calibrated on the official corpus), the canonical homebrew spell store, and the Liturgy Vol.2 book export."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-observe",
    "numpy>=2",
    "pydantic>=2",
]

[project.scripts]
assay = "astra_assay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_assay"]

[tool.uv.sources]
astra-config = { workspace = true }
astra-observe = { workspace = true }
