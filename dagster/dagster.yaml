# Phase 0 Dagster instance config — Postgres-backed run/event/schedule storage.
# Secrets come from env (compose injects them); real values move to SOPS later.
storage:
  postgres:
    postgres_db:
      hostname: dagster-postgres
      username:
        env: DAGSTER_PG_USERNAME
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # The pipeline runs are heavy (Whisper transcription, LLM distill/script, TTS) — cap
    # concurrency low so they don't pile 10-deep and thrash the box (the default is 10).
    max_concurrent_runs: 2

# Auto-detect + fail "zombie" runs whose worker died (e.g. a container recreated mid-run
# via `just up`) instead of leaving them STARTED forever, holding queue slots. Without
# this, a redeploy during a run jams the QueuedRunCoordinator.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300

# No phone-home.
telemetry:
  enabled: false
