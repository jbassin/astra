[project]
name = "astra-lexicon"
version = "0.0.0"
description = "Canonical-names vocabulary + phonetic matchers + corrections — the matching substrate shared by linguist (ASR correction) and heartwood (entity resolution)."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "metaphone>=0.6",
    "rapidfuzz>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_lexicon"]

[tool.hatch.build.targets.wheel.force-include]
"src/astra_lexicon/defs.kdl" = "astra_lexicon/defs.kdl"

[tool.uv.sources]
astra-config = { workspace = true }
