# Astra deploy substrate (roadmap Decision H):
#   - SigNoz (ClickHouse + zookeeper + UI + otel-collector + schema migrator),
#     vendored under deploy/signoz/ and `include`d so its own relative mounts
#     (../common/...) resolve correctly. Published ports remapped into 10350-10399.
#   - Dagster control plane (Postgres + code location + webserver + daemon).
#   - Caddy edge.
# SigNoz/OTel is the single pane across all three. Run from deploy/:
#   docker compose up -d
name: astra

include:
  - path: signoz/docker/docker-compose.yaml

x-dagster-env: &dagster-env
  DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME:-dagster}
  DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
  DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
  # Pipeline secrets injected as env by `just up` (Decision E) so the assets'
  # LLM/transcription calls resolve their `ref="sops:KEY"`s in-container (the code
  # server, daemon, and run workers all inherit this anchor).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  # mouthpiece's clean/enrich/script calls run on GLM 5.2 via OpenRouter; litellm reads
  # this key from env (llm.default-model = openrouter/z-ai/glm-5.2).
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

# Pipeline data dirs bind-mounted into every Dagster service (code/webserver/daemon)
# so the assets' disk-cache seams persist + are shared across the control plane (and
# with host-dev `uv run dagster dev`, which uses the same host dirs). Host-absolute
# paths kept (config-single-source: scribe/mouthpiece read them from config.kdl;
# linguist resolves them package-relative → `/repo/apps/linguist/...` in-container, so
# its mounts target /repo while scribe/mouthpiece bind same-path under /ruby).
x-dagster-volumes: &dagster-pipeline-volumes
  # scribe.incoming-path — the local Craig drop dir (zips copied here from the Drive
  # fuse mount, which Docker can't bind-mount). scribe reads + extracts, never deletes.
  - /ruby/data/experiments/astra/apps/scribe/incoming:/ruby/data/experiments/astra/apps/scribe/incoming
  - /ruby/data/experiments/astra/apps/scribe/data:/ruby/data/experiments/astra/apps/scribe/data
  - /ruby/data/experiments/astra/apps/scribe/tmp:/ruby/data/experiments/astra/apps/scribe/tmp
  - /ruby/data/experiments/astra/apps/linguist/transcripts:/repo/apps/linguist/transcripts
  - /ruby/data/experiments/astra/apps/linguist/script:/repo/apps/linguist/script
  - /ruby/data/experiments/astra/apps/linguist/data:/repo/apps/linguist/data
  # linguist/timeline is package-relative (chronicle.py) but was NOT mounted — so the
  # container-written chronicle output (campaign_timeline / session_episode_summary) landed
  # in the container layer, never reaching the host. Mount it so it persists host-owned.
  - /ruby/data/experiments/astra/apps/linguist/timeline:/repo/apps/linguist/timeline
  - /ruby/data/experiments/astra/apps/mouthpiece-backend/episodes:/ruby/data/experiments/astra/apps/mouthpiece-backend/episodes

services:
  # --- Dagster: the batch-pipeline control plane ---
  dagster-postgres:
    image: postgres:16-alpine
    container_name: astra-dagster-postgres
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    # PGDATA bind-mounted under the gitignored artifacts/ dir (was the named volume
    # astra-dagster-pg). No `user:` — the postgres entrypoint owns PGDATA as uid 70; the
    # one-time `just pg-migrate dagster` copy preserves 70:70/0700 so it's accepted.
    volumes:
      - /ruby/data/experiments/astra/artifacts/postgres/dagster:/var/lib/postgresql/data
    networks: [signoz-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USERNAME:-dagster} -d ${DAGSTER_PG_DB:-dagster}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dagster-code:
    build:
      # Repo root (like the frontend services) — the image `uv sync`s the Python
      # workspace so definitions.py can import the real pipeline packages.
      context: ..
      dockerfile: dagster/Dockerfile
    image: astra-dagster:local
    container_name: astra-dagster-code
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-f", "definitions.py"]
    # Run as the host repo owner (uid 1000) so the run worker's writes into the bind-mounted
    # pipeline dirs (linguist/data, transcripts, timeline, mouthpiece episodes, scribe data)
    # land host-owned instead of root:root — the same fix as heartwood below. The image
    # chowns /opt/dagster to 1000 (compute logs / DAGSTER_HOME) so this works.
    user: "1000:1000"
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    networks: [signoz-net]
    restart: unless-stopped

  dagster-webserver:
    image: astra-dagster:local
    container_name: astra-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    user: "1000:1000" # see dagster-code
    ports:
      - "10350:3000" # Dagster UI (astra range)
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started
    networks: [signoz-net]
    restart: unless-stopped

  dagster-daemon:
    image: astra-dagster:local
    container_name: astra-dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    user: "1000:1000" # see dagster-code
    environment: *dagster-env
    volumes: *dagster-pipeline-volumes
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started
    networks: [signoz-net]
    restart: unless-stopped

  # --- strider: the first SSR frontend (Decision I) — the template for 0011-0013 ---
  # One SSR process; the editor save runs in it as a TanStack server function
  # (writes content/layers/*.md). The /editor UI is gated to the local network at
  # the Caddy edge.

  # --- weal: the dice/host bot's roll-history + macro store (0009, Decision F) ---
  weal-postgres:
    image: postgres:16-alpine
    container_name: astra-weal-postgres
    environment:
      POSTGRES_USER: ${WEAL_PG_USERNAME:-weal}
      POSTGRES_PASSWORD: ${WEAL_PG_PASSWORD:-weal}
      POSTGRES_DB: ${WEAL_PG_DB:-weal}
    # PGDATA bind-mounted under artifacts/ (was named volume astra-weal-pg); see dagster-postgres.
    volumes:
      - /ruby/data/experiments/astra/artifacts/postgres/weal:/var/lib/postgresql/data
    ports:
      - "10362:5432" # weal dice/funcs store (astra range) — for the P6 SQLite→PG migration
    networks: [signoz-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WEAL_PG_USERNAME:-weal} -d ${WEAL_PG_DB:-weal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # weal-bot: the dice/host Discord bot (discord.js gateway + internal speak API).
  # No published port — Discord dials outbound; the speak API binds 127.0.0.1 only.
  # Won't fully run until the SOPS secrets (discord token, weal_token) are provisioned.
  weal-bot:
    build:
      context: ..
      dockerfile: apps/weal-bot/Dockerfile
    image: astra-weal-bot:local
    container_name: astra-weal-bot
    # All astra app containers run as the host owner (uid 1000) — node:24-slim (the
    # build AND runtime base for every app since 0022 S11; built-in `node`=uid 1000)
    # ships a uid-1000 user, and the app files are world-readable, so the SSR/bot
    # processes read + serve them fine; writes (where any) land host-owned.
    # Postgres/SigNoz keep their own uid.
    user: "1000:1000"
    depends_on:
      weal-postgres:
        condition: service_healthy
    # SOPS secrets injected as env by `just up` (Decision E); config's env-override
    # resolves the `ref="sops:KEY"`s in-container. Empty when not run via `just up`
    # (degrades). dice_feed_url is not provisioned yet (lands at cutover) → unset.
    environment:
      WEAL_DISCORD_KEY: ${WEAL_DISCORD_KEY:-}
      WEAL_TOKEN: ${WEAL_TOKEN:-}
    networks: [signoz-net]
    # Node 24 runtime (R3, 0022 S5; D13) — node:24-slim has global fetch, so the
    # healthcheck below needs no extra deps either.
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://127.0.0.1:10203/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # weal-overlay: the dice-roll OBS overlay (SSE). Behind Caddy with flush_interval -1.
  weal-overlay:
    build:
      context: ..
      dockerfile: apps/weal-overlay/Dockerfile
    image: astra-weal-overlay:local
    container_name: astra-weal-overlay
    # Node 24 runtime (R3, 0022 S8 — the runtime-exit recipe; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # Shared weal↔overlay token (Decision E env injection via `just up`).
    environment:
      WEAL_TOKEN: ${WEAL_TOKEN:-}
    ports:
      - "10361:10360" # weal-overlay (astra range); strider holds 10360
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10360/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  strider:
    build:
      context: ..
      dockerfile: apps/strider/Dockerfile
      args:
        APP: strider # the one knob in the templated frontend Dockerfile
    image: astra-strider:local
    container_name: astra-strider
    # Node 24 runtime (R3, 0022 S7 — the runtime-exit recipe; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10360:10360" # strider SSR (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10360/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- akasha-frontend: the wiki read-surface (0011) — SSR Compose service (Decision
  # I), the second 0011-0013 frontend on the strider template. Build-time snapshot +
  # transcripts + Pagefind index baked into the image; no live backend (Decision D).
  # The combined session audio each transcript plays is a runtime VOLUME (akasha-audio,
  # ~31 GB), served same-origin at /audio/<date>.mp3 — never in the image (D2). Seed
  # with `just akasha-seed`; this replaces faerrin's static-audio.iridi.cc. ---
  akasha-frontend:
    build:
      context: ..
      dockerfile: apps/akasha-frontend/Dockerfile
      args:
        APP: akasha-frontend # the one knob in the templated frontend Dockerfile
    image: astra-akasha-frontend:local
    container_name: astra-akasha-frontend
    # Node 24 runtime (R3, 0022 S6 — the audio-mounts Range/206 pilot; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10365:10365" # akasha-frontend SSR (astra range) — also reachable directly
    # Session audio bind-mounted from artifacts/ (was named volume astra-akasha-audio);
    # container path /audio unchanged → no config.kdl change. Seed with `just akasha-seed`.
    volumes:
      - /ruby/data/experiments/astra/artifacts/audio/akasha:/audio:ro # kdl akasha-frontend.audio-dir; served at /audio/<date>.mp3
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10365/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- codex (0029): the PF2e compendium/rules browser — SSR Compose service
  # (Decision I), on the heartwood-frontend model (not akasha's): nothing
  # content-shaped is baked into the image — the corpus + Pagefind search index
  # arrive via read-only bind mounts, request-time reads (D29-31). D29-53: the two
  # mounts are IDENTICAL host-path==container-path binds, the Dagster
  # pipeline-volume convention applied to a frontend for the first time — codex's
  # `codex.data-path` (config.kdl) is a host-absolute path consumed VERBATIM by
  # both `pnpm start` on the host and this container, and plain config fields have
  # no env-override mechanism, so identical-path is the only way to satisfy
  # config-single-source without a per-environment fork. `data/snapshots/` (601 MB,
  # runtime-unreferenced ingest input) and `data/tmp/` deliberately stay OUT of the
  # container — only the two narrow dirs below. No `environment:` — no secrets, and
  # the OTLP endpoint comes from config's in-cluster default. ---
  codex:
    build:
      context: ..
      dockerfile: apps/codex/Dockerfile
      args:
        APP: codex # the one knob in the templated frontend Dockerfile
    image: astra-codex:local
    container_name: astra-codex
    # Node 24 runtime (R3, 0022 S7 — the runtime-exit recipe; build stage also Node 24 + pnpm, 0022 S11).
    # node:24-slim has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10374:10374" # codex SSR (astra range) — also reachable directly
    # D29-53: identical-path read-only bind mounts (host path == container path).
    # Both dirs already exist at this stable host path, produced by
    # `just codex-refresh` outside artifacts/ — no artifacts-init change, no seed
    # recipe. Fresh-host caveat: Docker auto-creates a missing bind source as root,
    # which would serve the fixture corpus until `codex-refresh` runs once.
    volumes:
      - /ruby/data/experiments/astra/apps/codex/data/corpus:/ruby/data/experiments/astra/apps/codex/data/corpus:ro
      - /ruby/data/experiments/astra/apps/codex/data/search:/ruby/data/experiments/astra/apps/codex/data/search:ro
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10374/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- mouthpiece-frontend: the podcast read-surface (0012) — SSR Compose service
  # (Decision I), the third 0011-0013 frontend on the strider/akasha template. The
  # episode catalog (snapshot) is baked into the image; the 173 MB of episode audio is
  # a runtime VOLUME (mouthpiece-audio), served same-origin at /audio/ — never in the
  # image layer (D2). Seed the volume with `just mouthpiece-seed`. ---
  mouthpiece-frontend:
    build:
      context: ..
      dockerfile: apps/mouthpiece-frontend/Dockerfile
      args:
        APP: mouthpiece-frontend # the one knob in the templated frontend Dockerfile
    image: astra-mouthpiece-frontend:local
    container_name: astra-mouthpiece-frontend
    # Node 24 runtime (R3, 0022 S6 — the audio-mounts Range/206 pilot; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10366:10366" # mouthpiece-frontend SSR (astra range) — also reachable directly
    # Episode audio bind-mounted from artifacts/ (was named volume astra-mouthpiece-audio);
    # container path /audio unchanged → no config.kdl change. Seed with `just mouthpiece-seed`.
    volumes:
      - /ruby/data/experiments/astra/artifacts/audio/mouthpiece:/audio:ro # kdl mouthpiece-frontend.audio-dir; served at /audio/<id>.mp3
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10366/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- vellum-frontend: the document-forge editor (0013) — SSR Compose service
  # behind Caddy (Decision I). The editor route is client-only (ssr:false); the PNG
  # export POSTs same-origin /render, which Caddy routes to vellum-render below. ---
  vellum-frontend:
    build:
      context: ..
      dockerfile: apps/vellum-frontend/Dockerfile
      args:
        APP: vellum-frontend # the one knob in the templated frontend Dockerfile
    image: astra-vellum-frontend:local
    container_name: astra-vellum-frontend
    # Node 24 runtime (R3, 0022 S7 — the runtime-exit recipe; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10367:10367" # vellum-frontend SSR (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10367/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- vellum-render: the PNG render service (0013, D2) — a SEPARATE unit, the first
  # browser-in-a-container in astra (warm Chromium, egress-blocked, semaphore-gated).
  # Caddy routes vellum.iridi.cc/render + /health here. ---
  vellum-render:
    build:
      context: ..
      dockerfile: apps/vellum-render/Dockerfile
      args:
        APP: vellum-render
    image: astra-vellum-render:local
    container_name: astra-vellum-render
    # Node 24 runtime (R3, 0022 S9 — the runtime-exit recipe; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "src/server.ts"]
    # Runs as 1000 like the others; the Dockerfile chowns /ms-playwright so the (non-root)
    # Chromium can read its browser bundle. Profile is an ephemeral /tmp dir; --no-sandbox.
    user: "1000:1000"
    # No PORT env — serviceName/port come from config.kdl (config-single-source).
    ports:
      - "10368:10368" # vellum-render (astra range) — reached same-origin via Caddy /render
    networks: [signoz-net]
    healthcheck:
      # /health reports the warm-Chromium readiness; start_period covers the launch.
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10368/health').then(r=>r.json()).then(j=>process.exit(j.ready?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  # --- orator: the music bot's library store (0010, Decision F) ---
  orator-postgres:
    image: postgres:16-alpine
    container_name: astra-orator-postgres
    environment:
      POSTGRES_USER: ${ORATOR_PG_USERNAME:-orator}
      POSTGRES_PASSWORD: ${ORATOR_PG_PASSWORD:-orator}
      POSTGRES_DB: ${ORATOR_PG_DB:-orator}
    # PGDATA bind-mounted under artifacts/ (was named volume astra-orator-pg); see dagster-postgres.
    volumes:
      - /ruby/data/experiments/astra/artifacts/postgres/orator:/var/lib/postgresql/data
    ports:
      - "10364:5432" # orator music-library store (astra range)
    networks: [signoz-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORATOR_PG_USERNAME:-orator} -d ${ORATOR_PG_DB:-orator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # orator-backend: the Discord music service — srvx REST + voice + ingest + the
  # served operator SPA (Node 24 runtime, R3, 0022 S8 — off Bun.serve/Bun.SQL/
  # Bun.spawn). Behind Caddy at orator.iridi.cc. ALL runtime config is read from
  # config.kdl via @astra/config (no config env — config-single-source); the only
  # mount is the audio/data volume (kdl `orator.data-dir = /data`). The bot is
  # optional: without resolved SOPS secrets it runs web+library, playback → 503.
  orator-backend:
    build:
      context: ..
      dockerfile: apps/orator-backend/Dockerfile
    image: astra-orator-backend:local
    container_name: astra-orator-backend
    # Runs as 1000 so its ingest writes into the bind-mounted /data audio dir land
    # host-owned (it mounts rw, unlike the read-only frontends). See weal-bot.
    user: "1000:1000"
    depends_on:
      orator-postgres:
        condition: service_healthy
    # SOPS secrets injected as env by `just up` (Decision E) → config env-override
    # resolves them in-container. Empty when not run via `just up` (bot off, 503).
    environment:
      ORATOR_DISCORD_KEY: ${ORATOR_DISCORD_KEY:-}
      ORATOR_DISCORD_CLIENT_ID: ${ORATOR_DISCORD_CLIENT_ID:-}
      ORATOR_DISCORD_CLIENT_SECRET: ${ORATOR_DISCORD_CLIENT_SECRET:-}
      ORATOR_SESSION_SECRET: ${ORATOR_SESSION_SECRET:-}
    # Audio/data dir bind-mounted from artifacts/ (was named volume astra-orator-audio);
    # container path /data unchanged → no config.kdl change. One-time copy of the existing
    # library via `just orator-audio-migrate`.
    volumes:
      - /ruby/data/experiments/astra/artifacts/audio/orator:/data # kdl orator.data-dir; audio under /data/audio
    ports:
      - "10363:10363" # orator-backend (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10363/api/v1/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- harrow: the tarot deck reader (0017) — SSR Compose service behind Caddy
  # (Decision I), a backend-less sibling of strider. No DB, no audio/asset volume
  # (every card glyph is inline SVG). Port/service-name from config.kdl. ---
  harrow:
    build:
      context: ..
      dockerfile: apps/harrow/Dockerfile
      args:
        APP: harrow # the one knob in the templated frontend Dockerfile
    image: astra-harrow:local
    container_name: astra-harrow
    # Node 24 runtime (R3, 0022 S7 — the runtime-exit recipe; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10369:10369" # harrow SSR (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10369/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- ledger: the astra landing page (0018) — the simplest SSR frontend, a sibling
  # of harrow. One homepage: a gothic card grid linking the player-facing sites. No
  # backend, no DB, no volume — the linked URLs are baked from each site's config
  # public-origin at build time. Port/service-name from config.kdl. ---
  ledger:
    build:
      context: ..
      dockerfile: apps/ledger/Dockerfile
      args:
        APP: ledger # the one knob in the templated frontend Dockerfile
    image: astra-ledger:local
    container_name: astra-ledger
    # Node 24 runtime (R3, 0022 S4 — the pilot; D13). node:24-slim has global
    # fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    user: "1000:1000" # see weal-bot
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10370:10370" # ledger SSR (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10370/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- heartwood: the setting-wiki review surface (0020 Phase 4) — a PR-style review
  # app on the strider/vellum-editor template, where a human approves/edits/rejects the
  # LLM-proposed akasha pages heartwood-backend stages. THE departure from the other
  # frontends: it reads its content at RUNTIME from narrow bind-mounts (no baked
  # snapshot) and persists review decisions back to proposals/. ---
  heartwood:
    build:
      context: ..
      dockerfile: apps/heartwood-frontend/Dockerfile
      args:
        APP: heartwood-frontend # the one knob in the templated frontend Dockerfile
    image: astra-heartwood:local
    container_name: astra-heartwood
    # Node 24 runtime (R3, 0022 S7 — the runtime-exit recipe; D13). node:24-slim
    # has global fetch, so the healthcheck below needs no extra deps either.
    command: ["node", "--import", "../../libs/ts/site-kit/src/nodeTsResolve.mjs", "server.ts"]
    # B1 (the load-bearing bind-mount fix): every frontend/dagster container runs as
    # ROOT by default (no USER directive in any frontend Dockerfile). Without this, container
    # writes to proposals/ land 0:0 and the host (uid 1000, the repo owner) can't
    # git-commit them or let `just heartwood-apply` stamp review.kdl in place (the
    # vellum-render/dist EACCES class). 1000:1000 = the host repo owner → host-owned
    # writes. No `user:` precedent elsewhere in compose — added deliberately here.
    user: "1000:1000"
    # No PORT env — serviceName/port come from config.kdl (config-single-source);
    # compose only maps the published host port below.
    ports:
      - "10371:10371" # heartwood SSR (astra range) — also reachable directly
    # Narrow bind-mounts (the heartwood departure, P4.7): the surface reads the staged
    # proposals (rw — it writes review.kdl + edited .vellum back) and the akasha corpus
    # + snapshot (ro — for the rewrite diff + the crossref/slug set). The dangerous
    # write-BACK to the corpus is NOT here — it's the host-run `just heartwood-apply`.
    volumes:
      - /ruby/data/experiments/astra/apps/heartwood-backend/proposals:/repo/apps/heartwood-backend/proposals:rw
      - /ruby/data/experiments/astra/apps/akasha-backend/content:/repo/apps/akasha-backend/content:ro
      - /ruby/data/experiments/astra/apps/akasha-backend/snapshot:/repo/apps/akasha-backend/snapshot:ro
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10371/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- portal (0023): the FoundryVTT MCP+WS bridge server. TS on the orator-backend
  # template (D3, no build step for the server itself — the Dockerfile DOES build the
  # Foundry module, tsdown -> module/dist/main.js, packaged at runtime by the server
  # itself into an installable zip, D11). No frontend/SSR here: portal-server binds
  # /health, /mcp (Streamable-HTTP, D4/D10), /ws (the bridge, D6), and
  # /module/{module.json,portal.zip} (S6 install-by-Manifest-URL). Behind Caddy at
  # portal.iridi.cc; nothing works unless the GM has "Faerrin" launched (the liveness
  # constraint — bridge-status surfaces "offline", never a hang). ---
  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    image: astra-portal:local
    container_name: astra-portal
    user: "1000:1000"
    # SOPS secrets injected as env by `just up` (Decision E); config's env-override
    # resolves the D6 `ref="sops:..."` keys in-container, plus the 0028 D28-1 player
    # key. All three are load-bearing (index.ts throws at startup if any is
    # unresolved — no degraded mode, unlike orator's optional Discord token).
    environment:
      PORTAL_MCP_API_KEY: ${PORTAL_MCP_API_KEY:-}
      # NB: the env-override name is the SOPS key upper-cased (portal_player_api_key →
      # PORTAL_PLAYER_API_KEY), NOT the kdl field name — the mismatch crash-looped the
      # 0028 S4 deploy.
      PORTAL_PLAYER_API_KEY: ${PORTAL_PLAYER_API_KEY:-}
      PORTAL_BRIDGE_API_KEY: ${PORTAL_BRIDGE_API_KEY:-}
    # 0025 OAuth state (registered claude.ai clients + hashed tokens) bind-mounted
    # from artifacts/ so connections survive redeploys; container path matches kdl
    # portal.oauth-state-path (/data/oauth/state.json). Writes land 1000:1000.
    volumes:
      - /ruby/data/experiments/astra/artifacts/portal-oauth:/data/oauth
    ports:
      - "10372:10372" # portal (astra range) — also reachable directly
    networks: [signoz-net]
    healthcheck:
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10372/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- portal-headless (0027): the supervised headless-Chromium GM session — a
  # dedicated Foundry account ("Portal", full GM) permanently logged into the live
  # pf2e "Faerrin" world through the public edge, so portal's MCP tools work with no
  # human browser tab open. A SEPARATE unit from portal-server (D27-5): health-only,
  # not edge-routed (no Caddy entry), `signoz-net` alone (D27-3). Follows
  # vellum-render's browser-in-a-container lifecycle with D27-10's long-lived-tab
  # deltas: `shm_size` (Docker's 64MB `/dev/shm` default is the known Chromium OOM
  # source for a process-life-long page) and a generous `start_period` (Chromium warm-up
  # + first navigation + `/join`). ---
  portal-headless:
    build:
      context: ..
      dockerfile: apps/portal/headless/Dockerfile
    image: astra-portal-headless:local
    container_name: astra-portal-headless
    user: "1000:1000"
    shm_size: "1gb"
    # SOPS secret injected as env by `just up` (Decision E); config's env-override
    # resolves the D27-13 `ref="sops:foundry_portal_gm_password"` key in-container.
    # Load-bearing (index.ts throws at startup if unresolved, mirroring portal's two
    # keys) — a dummy value is fine for non-live acceptance runs, since D27-6's
    # classifier never reaches the login step against a world-down/unreachable target.
    environment:
      FOUNDRY_PORTAL_GM_PASSWORD: ${FOUNDRY_PORTAL_GM_PASSWORD:-}
    ports:
      - "10373:10373" # portal-headless (astra range) — health-only, not edge-routed
    networks: [signoz-net]
    healthcheck:
      # D27-11: process-up + browser-connected ONLY — `world-down` is a reported
      # `state`, never unhealthy (a restart can't launch a world; a restart-loop during
      # the GM's maintenance window would be noise).
      test: ["CMD", "node", "-e", "await fetch('http://localhost:10373/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# The production edge is the shared HOST reverse proxy at /ruby/data/reverse-proxy
# (it imports this repo's root sites.caddyfile; reload via `just caddy-reload`), so
# the substrate runs no Caddy of its own — services are reachable on their
# published host ports (Dagster 10350, SigNoz 10351, strider 10360).

# The astra Postgres + audio state that used to live in named volumes now lives in the
# gitignored artifacts/ dir, bind-mounted into each service (see above). The host owns it
# (uid 1000; Postgres PGDATA is uid 70 via its entrypoint). SigNoz keeps its own named
# volumes (declared in the vendored signoz include — clickhouse/sqlite/zookeeper).

networks:
  signoz-net:
    name: signoz-net
