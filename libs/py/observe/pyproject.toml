[project]
name = "astra-observe"
version = "0.0.0"
description = "OTel init shim — wires traces, metrics and logs to the SigNoz collector. CLIs wrap main() in astra_observe.run(); long-lived processes call init_telemetry()."
requires-python = ">=3.12"
dependencies = [
    # 1.45.1 fixes the tracestate parsing advisory (CVE-2026-114603).
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    # The stdlib-logging bridge; the SDK's own LoggingHandler is deprecated since 1.45.
    "opentelemetry-instrumentation-logging>=0.66b1",
    "astra-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_observe"]
