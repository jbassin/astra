[project]
name = "astra-smoke-substrate"
version = "0.0.0"
description = "End-to-end substrate smoke: config and SOPS, an OTel trace, one metered litellm call to the default GLM model, and ontology-being parity."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-observe",
    "astra-llm",
    "astra-ontology",
    "astra-ontology-config",
    "astra-ontology-being",
    "pydantic>=2",
]

[project.scripts]
astra-smoke-substrate = "astra_smoke_substrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_smoke_substrate"]
