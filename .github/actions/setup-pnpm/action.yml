name: setup-pnpm
description: Install just, the pinned Node + pnpm, and dependencies from the frozen lockfile.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-just
    # No version input: pnpm/action-setup reads package.json's packageManager.
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
