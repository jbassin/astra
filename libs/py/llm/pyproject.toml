[project]
name = "astra-llm"
version = "0.0.0"
description = "Shared LLM client (litellm transport, dspy program layer): truncation guard, prompt caching, forced-tool output to Pydantic, cost metered to OTel."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "dspy>=2.5",
    "pydantic>=2",
    "astra-config",
    "astra-observe",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_llm"]
