name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter: only run a lane when files it cares about changed.
  # apps/** feeds BOTH lanes because an app may be either language; each lane's
  # tooling only acts on members it actually owns (manifest-decided membership).
  changes:
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      ts: ${{ steps.filter.outputs.ts }}
      corpus: ${{ steps.filter.outputs.corpus }}
      vellumRender: ${{ steps.filter.outputs.vellumRender }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            py:
              - 'apps/**'
              - 'libs/py/**'
              - 'ontology/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.github/**'
            ts:
              - 'apps/**'
              - 'libs/ts/**'
              - 'package.json'
              - 'bun.lock'
              - 'biome.json'
              - 'tsconfig.base.json'
              - '.github/**'
            corpus:
              - 'apps/akasha-backend/content/**'
              - 'libs/ts/vellum-lang/**'
              - '.github/**'
            # The render output depends on the service + the renderer (gothic) + the
            # parser (vellum-lang); a change to any can shift the goldens.
            vellumRender:
              - 'apps/vellum-render/**'
              - 'libs/ts/gothic/**'
              - 'libs/ts/vellum-lang/**'
              - 'bun.lock'
              - '.github/**'

  py-lint:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ruff check
      - run: uv run ruff format --check

  py-typecheck:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ty check

  py-test:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest

  ts-typecheck:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun --filter '*' typecheck

  ts-lint:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bunx biome ci .

  ts-test:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun --filter '*' test

  ts-build:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun --filter '*' build

  # The akasha corpus structural gate (0007/F3): the TS reference parser asserts
  # zero error chips + zero sigil collisions over every converted vellum page.
  corpus-validate:
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun libs/ts/vellum-lang/scripts/validate-corpus.ts

  # The vellum-render golden-image gate (0013 D4). Runs in the PINNED container
  # oven/bun:1.3.14 with the Chromium the `playwright` lock pins (same env the
  # vellum-render image uses, so goldens don't drift). Builds the render-entry, then
  # compares each fixture's PNG to its committed golden (>0.5% pixel drift fails).
  vellum-visual-regression:
    needs: changes
    if: needs.changes.outputs.vellumRender == 'true'
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      # actions/checkout needs git inside the container.
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun --filter @astra/vellum-render build
      # `visual-regression`'s package.json script now reads `node …` (0022 S9), and
      # this pinned oven/bun container has no `node` binary — invoke the file
      # directly with bun instead of running the script through `bun --filter`
      # (which would exec the node-shaped command). S11 swaps this whole job to
      # the pinned Node container + pnpm.
      - run: cd apps/vellum-render && bun scripts/visual-regression.ts

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: >-
          bunx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
