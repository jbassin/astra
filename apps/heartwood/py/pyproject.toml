[project]
name = "astra-heartwood-backend"
version = "0.0.0"
description = "heartwood-backend — the akasha setting-wiki maintainer. A dspy.RLM agent reads one faerrin-world session transcript, browses the wiki + earlier transcripts through host-side tools, and edits a staging copy of the wiki (the astra-data clone's akasha/content) that publishes with no human review. Host-run CLI, started from the Dagster session_wiki asset through request files; LLM via libs/py/llm."
requires-python = ">=3.12"
dependencies = [
    "astra-akasha-backend",
    "astra-config",
    "dagster",
    "astra-lexicon",
    "astra-linguist",
    "astra-llm",
    "astra-observe",
    "astra-pipeline-resources",
    "astra-sessions",
    "astra-ontology",
    "astra-ontology-being",
    "astra-ontology-config",
    "astra-ontology-entity",
]

[project.scripts]
astra-heartwood-agent = "astra_heartwood.agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_heartwood"]
