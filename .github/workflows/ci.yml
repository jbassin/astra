name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests: a newer push to the same PR cancels the older run.
# main: never cancel. `cancel-in-progress: false` alone is not enough, because a
# concurrency group also replaces a *pending* run whenever a newer one queues
# behind it. So every main run gets its own group (the run id) and runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every lint/test job runs one `just <job>` recipe (same name as the job), so `just ci`
  # locally runs exactly these commands; the setup steps stay here.
  # Path filter: only run a lane when files it cares about changed.
  # Python lives only in apps/<domain>/py/ (ADR 0015), so the py lane watches those;
  # the ts lane keeps apps/** (every other role dir is a pnpm member).
  changes:
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      ts: ${{ steps.filter.outputs.ts }}
      corpus: ${{ steps.filter.outputs.corpus }}
      vellumRender: ${{ steps.filter.outputs.vellumRender }}
      codex: ${{ steps.filter.outputs.codex }}
      wealEngine: ${{ steps.filter.outputs.wealEngine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            py:
              - 'apps/*/py/**'
              - 'apps/*/tools/**'
              - 'libs/py/**'
              - 'ontology/**'
              # dagster/ and deploy/ are under ruff and ty.
              - 'dagster/**'
              - 'deploy/**'
              # ruff also lints the standalone scripts under libs/rust/ (gen_oracle.py).
              - 'libs/rust/**/*.py'
              # Root fixtures: read by the libs/py/vellum-lang and libs/py/config tests.
              - 'fixtures/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.python-version'
              # Every job runs a `just <job>` recipe.
              - 'justfile'
              - '.github/**'
            ts:
              - 'apps/**'
              - 'libs/ts/**'
              # libs/ts/config reads ontology/ontology-config/config.kdl.
              - 'ontology/**'
              # The weal-engine crate; the committed wasm is smoke-tested by
              # libs/ts/weal-engine's vitest suite.
              - 'libs/rust/**'
              # Root fixtures: read by the libs/ts/vellum-lang and libs/ts/config tests.
              - 'fixtures/**'
              # Root-level files oxfmt checks (package.json, commitlint.config.js).
              - '*.{js,mjs,cjs,json}'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tsconfig.base.json'
              - '.node-version'
              - 'justfile'
              - '.github/**'
            corpus:
              - 'fixtures/astra-data/akasha/content/**'
              - 'libs/ts/vellum-lang/**'
              - 'justfile'
              - '.github/**'
            # The render output depends on the service + the renderer (gothic) + the
            # parser (vellum-lang); a change to any can shift the goldens.
            vellumRender:
              - 'apps/vellum/render/**'
              - 'libs/ts/gothic/**'
              - 'libs/ts/vellum-lang/**'
              - 'pnpm-lock.yaml'
              - 'justfile'
              - '.github/**'
            # P9 S1 (D29-83) — the row-pitch drift guard needs a real Chromium,
            # same "own pinned-container job" posture as vellumRender above.
            codex:
              - 'apps/codex/web/**'
              - 'libs/ts/site-kit/**'
              - 'libs/ts/observe/**'
              - 'libs/ts/config/**'
              - 'pnpm-lock.yaml'
              - 'justfile'
              - '.github/**'
            # The weal-engine crate (ADR 0027). Its committed wasm output is watched too, so
            # a hand edit there reruns the crate's tests alongside the always-on hash check.
            wealEngine:
              - 'libs/rust/**'
              - 'libs/ts/weal-engine/gen/**'
              - 'justfile'
              - '.github/**'

  py-lint:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: just py-lint

  # Memory index budget and doc links (scripts/check_docs.py). Cheap, so no path filter.
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: just docs-check

  # The homebrew store (apps/assay/py/homebrew) against its Pydantic model and canonical format.
  assay-store-check:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: just assay-store-check

  py-typecheck:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: just py-typecheck

  py-test:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: just py-test

  # typecheck/test/build fan out with `pnpm -r --no-bail` (see the ts-typecheck recipe):
  # a failing member no longer hides the ones after it. This replaces `vp run -r`, which
  # stops at the first failure (0037 decision: replace vite-plus with `pnpm -r`).
  ts-typecheck:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: just ts-typecheck

  # Lint/format stay direct oxlint/oxfmt (no pnpm -r): the explicit globs in the root
  # package.json scripts are what keep oxfmt off markdown/toml/the SOPS file.
  ts-lint:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: just ts-lint

  ts-test:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: just ts-test

  ts-build:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: just ts-build

  # The akasha corpus structural gate (0007/F3): the TS reference parser asserts
  # zero error chips + zero sigil collisions over every converted vellum page. The real
  # wiki lives in the astra-data repo (heartwood validates the whole corpus before every
  # commit there); CI runs the gate over the checked-in fixture wiki.
  corpus-validate:
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: just corpus-validate

  # The vellum-render golden-image gate (0013 D4). Runs in the PINNED container
  # node:24-slim with the Chromium the `playwright` lock pins (same env the
  # vellum-render image uses, so goldens don't drift — the golden contract is
  # pinned to this exact image, 0022 S11). Builds the render-entry, then compares
  # each fixture's PNG to its committed golden (>0.5% pixel drift fails).
  vellum-visual-regression:
    needs: changes
    if: needs.changes.outputs.vellumRender == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      # actions/checkout needs git inside the container.
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-just
      # corepack installs the pnpm that package.json's packageManager pins.
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      # `playwright` is a devDependency of vellum-render only (pnpm's strict layout
      # doesn't hoist it to the root node_modules `npx` would search from root) — run
      # from the app dir, matching deploy/node.Dockerfile's `npx playwright install`
      # (its os-chromium stage also runs it from /repo/apps/<app>).
      - run: cd apps/vellum/render && npx playwright install --with-deps chromium
      - run: just vellum-visual-regression

  # P9 S1 (D29-83) — the listing row-pitch drift guard: a real Chromium probe
  # asserting `getBoundingClientRect().height === 24` on a rendered
  # `.codex-listing-row`, at both container tiers. Fixed-size windowing has no
  # self-correction if the live rendered height ever drifts off the token — see
  # `apps/codex/web/scripts/rowHeightDriftGuard.ts`'s own header for the "proxy-pin
  # class" this exists to catch. Same pinned-container posture as
  # vellum-visual-regression above (this repo's established pattern for a real-
  # Chromium CI check); runs against the generated FIXTURE corpus (CI has no
  # `apps/codex/web/data/`, D29-23's own fallback) — hermetic, no real-corpus data
  # asserted on, only CSS-driven row geometry.
  codex-row-height-drift-guard:
    needs: changes
    if: needs.changes.outputs.codex == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-just
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: cd apps/codex/web && npx playwright install --with-deps chromium
      # The guard script generates the fixture corpus and pins CODEX_CORPUS_ROOT to it
      # from the working directory. (Inside a container job `${{ github.workspace }}` is the
      # HOST path, not the container mount, so the workflow must not build that path.)
      - run: just codex-row-height-drift-guard

  # P9 S2 (D29-84/-85/-90) — the listing-virtualization INTERACTION guard: a
  # real Chromium probe over gate C (j/k frontier + wheel-unmount-resume +
  # row-body click/text-drag/modified-click), D (deep-link centering), and E
  # (scroll-deep-then-reload restoration) — none of these are observable from
  # `jsdom` (no real scroll/wheel events, no real keyboard-vs-synthetic-click
  # `detail`, no real pre-hydration scroll-restoration `<script>` timing). Same
  # pinned-container posture as `codex-row-height-drift-guard` above; runs
  # against the generated FIXTURE corpus's `ritual` category (grown to 96 rows
  # SPECIFICALLY so it clears `SSR_WINDOW`=60 — see
  # `scripts/virtualizationInteractionGuard.ts`'s own header) — hermetic, no
  # real corpus touched.
  codex-virtualization-interaction-guard:
    needs: changes
    if: needs.changes.outputs.codex == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-just
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: cd apps/codex/web && npx playwright install --with-deps chromium
      # Same fixture handling as codex-row-height-drift-guard (see the note there).
      - run: just codex-virtualization-interaction-guard

  # The weal-engine crate's own gate (ADR 0027): fmt, clippy and tests. rustup installs the
  # toolchain the crate's rust-toolchain.toml pins (1.96.0 with rustfmt and clippy). It
  # doesn't rebuild the wasm; weal-engine-hash-check below catches a stale gen/.
  weal-engine-rust:
    needs: changes
    if: needs.changes.outputs.wealEngine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-just
      - run: cd libs/rust/weal-engine && rustup toolchain install
      - run: just weal-engine-rust

  # The committed wasm in libs/ts/weal-engine/gen matches the crate's sources: the
  # sha256 stamp gen/SOURCE_SHA256 that `just weal-engine-build` writes. Needs no Rust
  # toolchain and takes a second, so no path filter.
  weal-engine-hash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-just
      - run: just weal-engine-hash-check

  # Conventional Commits (commitlint.config.js extends @commitlint/config-conventional).
  # Pull requests lint base..head; pushes to main lint only the pushed range, so
  # commits that predate this job can never fail it.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Lint the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: just commitlint "$FROM" "$TO"
      - name: Lint the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A branch creation sends an all-zero `before`, and a force push can send a
          # `before` this clone no longer has. Neither gives a base for a range, so
          # lint the pushed tip commit alone.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit (before=$BEFORE); linting $AFTER only."
            just commitlint "" "$AFTER"
          else
            just commitlint "$BEFORE" "$AFTER"
          fi

  # The single status check branch protection will require. It needs every other
  # job: a failed or cancelled job fails it, and a job skipped by the path filter
  # counts as passed. It blocks; it does not notify anyone, by design.
  # Add every new job to `needs` below; the first step fails if one is missing.
  ci-ok:
    if: always()
    needs:
      - changes
      - py-lint
      - docs-check
      - py-typecheck
      - py-test
      - ts-typecheck
      - ts-lint
      - ts-test
      - ts-build
      - corpus-validate
      - vellum-visual-regression
      - codex-row-height-drift-guard
      - codex-virtualization-interaction-guard
      - weal-engine-rust
      - weal-engine-hash-check
      - assay-store-check
      - commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Check that ci-ok needs every job in this workflow
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          declared=$(awk '/^jobs:/ { in_jobs = 1; next }
            in_jobs && /^  [A-Za-z0-9_-]+:/ { sub(/^  /, ""); sub(/:.*/, ""); print }' \
            .github/workflows/ci.yml | grep -vx ci-ok | sort)
          needed=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          missing=$(comm -23 <(echo "$declared") <(echo "$needed") | paste -sd, -)
          if [ -n "$missing" ]; then
            echo "::error::ci-ok does not need these jobs: $missing"
            exit 1
          fi
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r '[to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key] | join(", ")' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::These jobs failed or were cancelled: $bad"
            exit 1
          fi
