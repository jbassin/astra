[project]
name = "astra-mouthpiece-tools"
version = "0.0.0"
description = "mouthpiece-tools — mouthpiece's hand-run, paid tools (ADR 0023): the producer CLI with the 0034 script experiment, and the prediction-roundtable special. Host-run from a checkout via the just mouthpiece-* recipes; the Dagster image does not install it."
requires-python = ">=3.12"
dependencies = [
    "astra-akasha-backend",
    "astra-config",
    "astra-linguist",
    "astra-llm",
    "astra-mouthpiece-backend",
    "astra-observe",
    "astra-sessions",
    "astra-ontology-being",
    "pydantic>=2",
]

[project.scripts]
astra-mouthpiece-producer = "astra_mouthpiece_tools.producer.cli:main"
astra-mouthpiece-roundtable = "astra_mouthpiece_tools.roundtable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_mouthpiece_tools"]
