[tool.uv.workspace]
# Membership is decided by the presence of a `pyproject.toml` in a matched dir.
# Empty placeholder dirs are NOT created up front: uv rejects a glob-matched
# directory that lacks a `pyproject.toml`, so member dirs appear per-phase.
members = ["apps/*", "libs/py/*", "ontology/*"]
# TS-only apps live under apps/* too (manifest-decided membership: package.json →
# bun, pyproject.toml → uv). uv would otherwise hard-error on a glob-matched dir
# without a pyproject.toml, so exclude the bun-only frontends explicitly. Add each
# new TS app here (0011-0013 frontends follow strider; weal-bot/weal-overlay are
# bun services + SPA per 0009).
exclude = ["apps/strider", "apps/akasha-frontend", "apps/mouthpiece-frontend", "apps/vellum-frontend", "apps/vellum-render", "apps/weal-bot", "apps/weal-overlay", "apps/orator-backend", "apps/orator-controller", "apps/harrow", "apps/ledger"]

[tool.uv]
# Workspace-wide dev tooling — the Astral Python stack.
#   ruff = lint + format, ty = type check (preview; pinned), pytest = tests.
dev-dependencies = [
    "ruff>=0.8",
    "ty==0.0.51",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["libs/py", "apps", "ontology"]
addopts = "-q"

[tool.ty.src]
# dagster/ and deploy/ are NOT uv workspace members — they run in their own
# environments (the Dagster Docker image; ephemeral `uv run --with` for the
# telemetry smoke), so their imports aren't in the workspace venv. Keep them out
# of the workspace type check.
exclude = ["dagster/", "deploy/"]
