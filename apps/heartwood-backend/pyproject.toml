[project]
name = "astra-heartwood-backend"
version = "0.0.0"
description = "heartwood-backend — the akasha setting-wiki maintainer (0020). Phase 2: a read-only extraction engine — world-filter → LLM filter (drop OOC/combat/play-by-play) → call_structured noun-facts → resolve() against the entity registry → committed per-session facts. Dagster per-session asset; LLM via libs/py/llm (raw, no dspy)."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-linguist",
    "astra-llm",
    "astra-observe",
    "astra-ontology",
    "astra-ontology-being",
    "astra-ontology-entity",
    "dagster",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_heartwood"]

[tool.uv.sources]
astra-config = { workspace = true }
astra-linguist = { workspace = true }
astra-llm = { workspace = true }
astra-observe = { workspace = true }
astra-ontology = { workspace = true }
astra-ontology-being = { workspace = true }
astra-ontology-entity = { workspace = true }
