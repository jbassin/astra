[project]
name = "astra-sessions"
version = "0.0.0"
description = "Session identity shared by the pipeline apps: session date keys, Craig recording and transcript filename parsing, atomic writes, and the RLM agents' shared read-only tool bodies."
requires-python = ">=3.12"
dependencies = [
    "astra-llm",
    "astra-ontology",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_sessions"]
