[project]
name = "astra-linguist"
version = "0.0.0"
description = "linguist — transcript processing (0006): scribe script.json → formatted/canonical transcript + mouthpiece context, and the chronicle. Python Dagster assets. The largest pipeline subsystem."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-lexicon",
    "astra-llm",
    "astra-observe",
    "astra-ontology",
    "astra-ontology-being",
    "dagster",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_linguist"]

[tool.uv.sources]
astra-config = { workspace = true }
astra-lexicon = { workspace = true }
astra-llm = { workspace = true }
astra-observe = { workspace = true }
astra-ontology = { workspace = true }
astra-ontology-being = { workspace = true }
