[project]
name = "astra-observe"
version = "0.0.0"
description = "OTel init shim — wires traces, metrics and logs to the SigNoz collector. CLIs wrap main() in astra_observe.run(); long-lived processes call init_telemetry()."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "astra-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_observe"]
