name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests: a newer push to the same PR cancels the older run.
# main: never cancel. `cancel-in-progress: false` alone is not enough, because a
# concurrency group also replaces a *pending* run whenever a newer one queues
# behind it. So every main run gets its own group (the run id) and runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter: only run a lane when files it cares about changed.
  # apps/** feeds BOTH lanes because an app may be either language; each lane's
  # tooling only acts on members it actually owns (manifest-decided membership).
  changes:
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      ts: ${{ steps.filter.outputs.ts }}
      corpus: ${{ steps.filter.outputs.corpus }}
      vellumRender: ${{ steps.filter.outputs.vellumRender }}
      codex: ${{ steps.filter.outputs.codex }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            py:
              - 'apps/**'
              - 'libs/py/**'
              - 'ontology/**'
              # dagster/ and deploy/ are under ruff and ty.
              - 'dagster/**'
              - 'deploy/**'
              # ruff also lints the standalone scripts under libs/rust/ (gen_oracle.py).
              - 'libs/rust/**/*.py'
              # Root fixtures: read by libs/py/vellum-lang's corpus test.
              - 'fixtures/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.github/**'
            ts:
              - 'apps/**'
              - 'libs/ts/**'
              # libs/ts/config reads ontology/ontology-config/config.kdl.
              - 'ontology/**'
              # The weal-engine crate; the committed wasm is smoke-tested by
              # libs/ts/weal-engine's vitest suite.
              - 'libs/rust/**'
              # Root fixtures: read by libs/ts/vellum-lang's corpus test.
              - 'fixtures/**'
              # Root-level files oxfmt checks (package.json, commitlint.config.js).
              - '*.{js,mjs,cjs,json}'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tsconfig.base.json'
              - '.github/**'
            corpus:
              - 'apps/akasha-backend/content/**'
              - 'libs/ts/vellum-lang/**'
              - '.github/**'
            # The render output depends on the service + the renderer (gothic) + the
            # parser (vellum-lang); a change to any can shift the goldens.
            vellumRender:
              - 'apps/vellum-render/**'
              - 'libs/ts/gothic/**'
              - 'libs/ts/vellum-lang/**'
              - 'pnpm-lock.yaml'
              - '.github/**'
            # P9 S1 (D29-83) — the row-pitch drift guard needs a real Chromium,
            # same "own pinned-container job" posture as vellumRender above.
            codex:
              - 'apps/codex/**'
              - 'libs/ts/site-kit/**'
              - 'libs/ts/observe/**'
              - 'libs/ts/config/**'
              - 'pnpm-lock.yaml'
              - '.github/**'

  py-lint:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ruff check
      - run: uv run ruff format --check

  py-typecheck:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ty check

  py-test:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest

  # typecheck/test/build fan out with `pnpm -r --no-bail run <script>`: every
  # workspace member that defines the script runs (in dependency order), a failing
  # member no longer hides the ones after it, and the command still exits non-zero
  # if any member failed. `--aggregate-output` prints each member's log as one block.
  # This replaces `vp run -r`, which stops at the first failure (0037 decision:
  # replace vite-plus with `pnpm -r`). `tsc --noEmit` stays the typecheck gate.
  ts-typecheck:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm -r --no-bail --aggregate-output run typecheck

  # Lint/format stay DIRECT oxlint/oxfmt: the explicit globs here are what keeps
  # oxfmt off markdown/toml/the SOPS file.
  ts-lint:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec oxlint --type-aware --deny-warnings apps libs/ts
      - run: pnpm exec oxfmt --check 'apps/**/*.{js,jsx,ts,tsx,json,css}' 'libs/ts/**/*.{js,jsx,ts,tsx,json,css}' '*.{js,mjs,cjs,json}'

  ts-test:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm -r --no-bail --aggregate-output run test

  ts-build:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm -r --no-bail --aggregate-output run build

  # The akasha corpus structural gate (0007/F3): the TS reference parser asserts
  # zero error chips + zero sigil collisions over every converted vellum page.
  corpus-validate:
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: node --import ./libs/ts/site-kit/src/nodeTsResolve.mjs libs/ts/vellum-lang/scripts/validate-corpus.ts

  # The vellum-render golden-image gate (0013 D4). Runs in the PINNED container
  # node:24-slim with the Chromium the `playwright` lock pins (same env the
  # vellum-render image uses, so goldens don't drift — the golden contract is
  # pinned to this exact image, 0022 S11). Builds the render-entry, then compares
  # each fixture's PNG to its committed golden (>0.5% pixel drift fails).
  vellum-visual-regression:
    needs: changes
    if: needs.changes.outputs.vellumRender == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      # actions/checkout needs git inside the container.
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@10.34.4 --activate
      - run: pnpm install --frozen-lockfile
      # `playwright` is a devDependency of vellum-render only (pnpm's strict layout
      # doesn't hoist it to the root node_modules `npx` would search from root) — run
      # from the app dir, matching apps/vellum-render/Dockerfile's `npx playwright
      # install` (also run from WORKDIR /repo/apps/vellum-render).
      - run: cd apps/vellum-render && npx playwright install --with-deps chromium
      - run: pnpm --filter @astra/vellum-render build
      - run: cd apps/vellum-render && node --import ../../libs/ts/site-kit/src/nodeTsResolve.mjs scripts/visual-regression.ts

  # P9 S1 (D29-83) — the listing row-pitch drift guard: a real Chromium probe
  # asserting `getBoundingClientRect().height === 24` on a rendered
  # `.codex-listing-row`, at both container tiers. Fixed-size windowing has no
  # self-correction if the live rendered height ever drifts off the token — see
  # `apps/codex/scripts/rowHeightDriftGuard.ts`'s own header for the "proxy-pin
  # class" this exists to catch. Same pinned-container posture as
  # vellum-visual-regression above (this repo's established pattern for a real-
  # Chromium CI check); runs against the committed FIXTURE corpus (CI has no
  # `apps/codex/data/`, D29-23's own fallback) — hermetic, no real-corpus data
  # asserted on, only CSS-driven row geometry.
  codex-row-height-drift-guard:
    needs: changes
    if: needs.changes.outputs.codex == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@10.34.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: cd apps/codex && npx playwright install --with-deps chromium
      - run: pnpm --filter @astra/codex build
      # CODEX_CORPUS_ROOT pins the guard to the committed fixture corpus. Inside a
      # container job `${{ github.workspace }}` expands to the HOST path
      # (/home/runner/work/...), not the container mount (/__w/...), so the path is
      # built from the in-container $GITHUB_WORKSPACE instead.
      - run: |
          export CODEX_CORPUS_ROOT="$GITHUB_WORKSPACE/apps/codex/fixtures/entities"
          cd apps/codex
          node --import ../../libs/ts/site-kit/src/nodeTsResolve.mjs scripts/rowHeightDriftGuard.ts

  # P9 S2 (D29-84/-85/-90) — the listing-virtualization INTERACTION guard: a
  # real Chromium probe over gate C (j/k frontier + wheel-unmount-resume +
  # row-body click/text-drag/modified-click), D (deep-link centering), and E
  # (scroll-deep-then-reload restoration) — none of these are observable from
  # `jsdom` (no real scroll/wheel events, no real keyboard-vs-synthetic-click
  # `detail`, no real pre-hydration scroll-restoration `<script>` timing). Same
  # pinned-container posture as `codex-row-height-drift-guard` above; runs
  # against the committed FIXTURE corpus's `ritual` category (grown to 96 rows
  # SPECIFICALLY so it clears `SSR_WINDOW`=60 — see
  # `scripts/virtualizationInteractionGuard.ts`'s own header) — hermetic, no
  # real corpus touched.
  codex-virtualization-interaction-guard:
    needs: changes
    if: needs.changes.outputs.codex == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@10.34.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: cd apps/codex && npx playwright install --with-deps chromium
      - run: pnpm --filter @astra/codex build
      # Same CODEX_CORPUS_ROOT pin as codex-row-height-drift-guard (see the note there).
      - run: |
          export CODEX_CORPUS_ROOT="$GITHUB_WORKSPACE/apps/codex/fixtures/entities"
          cd apps/codex
          node --import ../../libs/ts/site-kit/src/nodeTsResolve.mjs scripts/virtualizationInteractionGuard.ts

  # Conventional Commits (commitlint.config.js extends @commitlint/config-conventional).
  # Pull requests lint base..head; pushes to main lint only the pushed range, so
  # commits that predate this job can never fail it.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Lint the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
      - name: Lint the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A branch creation sends an all-zero `before`, and a force push can send a
          # `before` this clone no longer has. Neither gives a base for a range, so
          # lint the pushed tip commit alone.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit (before=$BEFORE); linting $AFTER only."
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

  # The single status check branch protection will require. It needs every other
  # job: a failed or cancelled job fails it, and a job skipped by the path filter
  # counts as passed. It blocks; it does not notify anyone, by design.
  # Add every new job to `needs` below; the first step fails if one is missing.
  ci-ok:
    if: always()
    needs:
      - changes
      - py-lint
      - py-typecheck
      - py-test
      - ts-typecheck
      - ts-lint
      - ts-test
      - ts-build
      - corpus-validate
      - vellum-visual-regression
      - codex-row-height-drift-guard
      - codex-virtualization-interaction-guard
      - commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Check that ci-ok needs every job in this workflow
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          declared=$(awk '/^jobs:/ { in_jobs = 1; next }
            in_jobs && /^  [A-Za-z0-9_-]+:/ { sub(/^  /, ""); sub(/:.*/, ""); print }' \
            .github/workflows/ci.yml | grep -vx ci-ok | sort)
          needed=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          missing=$(comm -23 <(echo "$declared") <(echo "$needed") | paste -sd, -)
          if [ -n "$missing" ]; then
            echo "::error::ci-ok does not need these jobs: $missing"
            exit 1
          fi
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r '[to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key] | join(", ")' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::These jobs failed or were cancelled: $bad"
            exit 1
          fi
