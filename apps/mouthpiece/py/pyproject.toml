[project]
name = "astra-mouthpiece-backend"
version = "0.0.0"
description = "mouthpiece-backend — session transcript → tavern-tone roundtable script → episode audio (caster rewrite, 0008), as a Dagster per-session asset graph. LLM via libs/py/llm (raw, no dspy); grounding reads akasha; hosts/voices from ontology-being."
requires-python = ">=3.12"
dependencies = [
    "astra-akasha-backend",
    "astra-config",
    "astra-lexicon",
    "astra-linguist",
    "astra-llm",
    "astra-observe",
    "astra-pipeline-resources",
    "astra-sessions",
    "astra-ontology",
    "astra-ontology-being",
    "astra-ontology-config",
    "astra-ontology-entity",
    "dagster",
    "httpx",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_mouthpiece"]
