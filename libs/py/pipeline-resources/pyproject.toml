[project]
name = "astra-pipeline-resources"
version = "0.0.0"
description = "The Dagster resources the pipeline apps share: the loaded config.kdl, the pipeline's data paths, and the LLM client. Assets declare them as parameters; tests pass fakes."
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-llm",
    "dagster",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_pipeline_resources"]
